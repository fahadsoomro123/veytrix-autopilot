<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b12"><title>VEYTRIX — Flagship Preview</title>
<style>
:root{--bg:#070a10;--surface:#0d121b;--surface2:#111824;--surface3:#151e2c;--line:#202b3a;--text:#f3f6fb;--muted:#8d9aae;--dim:#5d6a7e;--violet:#8b7cff;--cyan:#52d7ff;--green:#5ee6a8;--amber:#ffc66d;--red:#ff7187;--r:22px;--shadow:0 24px 70px rgba(0,0,0,.38)}*{box-sizing:border-box}html,body{margin:0;background:radial-gradient(circle at 75% -10%,#1a2340 0,#0a0d15 34%,#070a10 70%);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100%;overflow-x:hidden}button,input{font:inherit}button{color:inherit;border:0;cursor:pointer}.app{width:min(100%,1120px);margin:auto;min-height:100vh;display:grid;grid-template-columns:220px 1fr}.sidebar{border-right:1px solid rgba(255,255,255,.06);padding:28px 14px;position:sticky;top:0;height:100vh}.brand{display:flex;gap:11px;align-items:center;padding:4px 10px 30px}.mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#b7afff,#6256ee);box-shadow:0 0 30px #7569ff55;display:grid;place-items:center;font-weight:900}.brand b{letter-spacing:.12em}.nav{display:grid;gap:5px}.nav button{background:none;text-align:left;padding:12px 13px;border-radius:13px;color:var(--muted);display:flex;gap:11px;align-items:center}.nav button:hover,.nav button.active{background:#ffffff08;color:#fff}.nav button.active{box-shadow:inset 2px 0 var(--violet)}.icon{width:20px;text-align:center;color:inherit}.side-status{position:absolute;bottom:22px;left:18px;right:18px;border:1px solid var(--line);background:#0b1018cc;border-radius:17px;padding:12px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green);margin-right:7px}.main{padding:24px 26px 100px;min-width:0;min-height:100vh}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.15em;color:var(--dim)}h1{font-size:28px;line-height:1.1;margin:4px 0 0;letter-spacing:-.04em}.top-actions{display:flex;gap:8px}.ghost,.primary,.danger{border-radius:12px;padding:10px 13px;background:#ffffff08;border:1px solid var(--line)}.primary{background:linear-gradient(135deg,#8174ff,#5f55df);border-color:#9d95ff55;box-shadow:0 10px 30px #6d61ff28}.danger{background:#ff718710;border-color:#ff718735;color:#ff9aac}.screen{display:none;animation:in .28s ease}.screen.active{display:block}@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}.grid{display:grid;gap:14px}.g2{grid-template-columns:1.35fr .85fr}.g3{grid-template-columns:repeat(3,1fr)}.card{background:linear-gradient(180deg,#111824e8,#0c121be8);border:1px solid rgba(255,255,255,.065);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}.card:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(120deg,#ffffff05,transparent 38%)}.label{color:var(--muted);font-size:12px}.value{font-size:26px;font-weight:750;letter-spacing:-.04em}.small{font-size:12px;color:var(--muted)}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 9px;color:var(--muted);font-size:11px}.pill.green{color:var(--green);border-color:#5ee6a82c;background:#5ee6a809}.pill.violet{color:#b8b1ff;border-color:#8b7cff35;background:#8b7cff0b}.pill.amber{color:var(--amber);border-color:#ffc66d30;background:#ffc66d0a}.hero{min-height:400px;display:flex;flex-direction:column;justify-content:space-between;background:radial-gradient(circle at 50% 35%,#6559ff18,transparent 36%),linear-gradient(180deg,#111825,#0a0f17)}.engine{width:190px;height:190px;margin:10px auto 0;border-radius:50%;position:relative;background:radial-gradient(circle at 35% 28%,#e6e3ff 0 3%,#9b91ff 10%,#4037a8 36%,#14172e 62%,#080b12 72%);box-shadow:0 0 50px #796dff38,inset -22px -28px 50px #0009,inset 9px 8px 25px #fff3;animation:float 4.5s ease-in-out infinite}.engine:before,.engine:after{content:"";position:absolute;inset:-18px;border-radius:50%;border:1px solid #8b7cff40;transform:rotate(25deg)}.engine:after{inset:-34px;border-color:#52d7ff25;transform:rotate(-30deg) scaleX(.75)}@keyframes float{50%{transform:translateY(-8px) rotate(2deg)}}.core{position:absolute;inset:55px;border-radius:50%;background:radial-gradient(circle,#fff,#b9b1ff 20%,#7a6fff 45%,#4b42bd 70%,transparent 72%);filter:blur(.2px);box-shadow:0 0 35px #9c93ff}.hero-copy{text-align:center}.hero-copy h2{font-size:25px;margin:5px 0}.hero-copy p{color:var(--muted);margin:0 auto 18px;max-width:460px}.cta{width:100%;padding:14px;border-radius:14px;font-weight:750;background:linear-gradient(135deg,#8b7cff,#5b51dc);box-shadow:0 16px 35px #6b60ff2b}.metric{padding:15px}.metric .value{margin-top:4px}.list{display:grid;gap:8px;margin-top:12px}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border-radius:14px;background:#ffffff04;border:1px solid #ffffff07}.item strong{display:block}.bar{height:6px;border-radius:99px;background:#ffffff0b;overflow:hidden}.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--violet),var(--cyan))}.steps{display:grid;gap:7px}.step{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;padding:12px;border-radius:14px;border:1px solid var(--line);background:#ffffff03}.step .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#ffffff08;color:var(--muted);font-size:11px}.step.done .n{background:#5ee6a81a;color:var(--green)}.step.active{border-color:#8b7cff55;background:#8b7cff08}.step.active .n{background:#8b7cff;color:#fff}.timeline{position:relative;padding-left:18px}.timeline:before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:1px;background:var(--line)}.event{position:relative;padding:0 0 20px 18px}.event:before{content:"";position:absolute;left:-17px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--violet);box-shadow:0 0 12px #8b7cff}.event.done:before{background:var(--green);box-shadow:0 0 10px #5ee6a8}.code{font:12px/1.6 ui-monospace,SFMono-Regular,monospace;color:#aeb9ca;background:#080c13;border:1px solid var(--line);border-radius:15px;padding:13px;overflow:auto}.artifact{display:flex;gap:16px;align-items:center}.artifact-visual{width:82px;height:104px;border-radius:12px;background:linear-gradient(145deg,#242d3b,#0c1119);border:1px solid #ffffff13;box-shadow:12px 14px 25px #0007,inset 1px 1px #fff1;transform:perspective(400px) rotateY(-10deg);display:grid;place-items:center}.artifact-visual b{font-size:11px;letter-spacing:.08em}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:15px}.tabs button{white-space:nowrap;background:#ffffff05;border:1px solid var(--line);border-radius:999px;padding:8px 12px;color:var(--muted)}.tabs button.on{color:#fff;background:#8b7cff12;border-color:#8b7cff44}.field{display:grid;gap:7px}.field label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}.field input,.field textarea,.select{width:100%;background:#080d15;border:1px solid var(--line);color:#fff;border-radius:13px;padding:12px;outline:none}.field textarea{min-height:110px;resize:vertical}.field input:focus,.field textarea:focus{border-color:#8b7cff70;box-shadow:0 0 0 3px #8b7cff10}.form{display:grid;gap:13px}.switch{width:42px;height:24px;border-radius:99px;background:#ffffff13;padding:3px}.switch i{display:block;width:18px;height:18px;border-radius:50%;background:#758196}.switch.on{background:#8b7cff}.switch.on i{margin-left:18px;background:#fff}.mobile-nav{display:none}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:#121a26f2;border:1px solid #ffffff18;padding:11px 15px;border-radius:13px;opacity:0;pointer-events:none;transition:.25s;z-index:10}.toast.show{opacity:1;transform:translate(-50%,0)}.search{display:flex;gap:8px;margin-bottom:14px}.search input{flex:1;background:#ffffff05;border:1px solid var(--line);padding:11px 13px;border-radius:12px;color:#fff}.danger-text{color:var(--red)}

/* RESPONSIVE PREVIEW FIX: no artificial viewport gaps + mobile layout before browser emulation widths */
@media(max-width:900px){.app{display:block;width:100%;min-height:100vh}.sidebar{display:none}.main{padding:16px 14px 92px;min-height:100vh}.top{margin-bottom:16px}.top h1{font-size:24px}.top-actions .ghost{display:none}.g2,.g3{grid-template-columns:1fr}.hero{min-height:0;height:auto}.mobile-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;z-index:8;bottom:10px;left:10px;right:10px;padding:7px;background:#0d131de8;border:1px solid #ffffff10;backdrop-filter:blur(22px);border-radius:19px;box-shadow:0 15px 50px #0009}.mobile-nav button{background:none;color:var(--dim);padding:7px 2px;font-size:10px}.mobile-nav button.active{color:#fff}.mobile-nav .mi{font-size:16px;display:block;margin-bottom:2px}.card{border-radius:19px;padding:16px}.engine{width:165px;height:165px}.core{inset:48px}.side-status{display:none}.grid{gap:12px}.screen>.grid,.screen>.card{margin-bottom:12px}.screen>.grid:last-child,.screen>.card:last-child{margin-bottom:0}}
@media(max-width:420px){.main{padding-left:12px;padding-right:12px}.card{padding:15px}.value{font-size:23px}.hero{min-height:0}.engine{width:150px;height:150px}.core{inset:44px}.mobile-nav{left:7px;right:7px;bottom:7px}}
@media(max-width:340px){.main{padding-left:9px;padding-right:9px}.card{padding:13px}.value{font-size:22px}.engine{width:140px;height:140px}.core{inset:40px}.mobile-nav{left:5px;right:5px}.mobile-nav button{font-size:9px}}
</style></head>
<body><div class="app"><aside class="sidebar"><div class="brand"><div class="mark">V</div><b>VEYTRIX</b></div><nav class="nav" id="nav"></nav><div class="side-status"><span class="dot"></span>All systems nominal<div class="small" style="margin-top:5px">Autonomy core · v0.9 preview</div></div></aside><main class="main"><div class="top"><div><div class="eyebrow" id="eyebrow">Autonomous engineering control</div><h1 id="title">Command Center</h1></div><div class="top-actions"><button class="ghost" onclick="toast('Command palette is available in the preview')">⌘K</button><button class="primary" onclick="go('new')">New mission</button></div></div><div id="screens"></div></main></div><nav class="mobile-nav" id="mobileNav"></nav><div class="toast" id="toast"></div>
<script>
const screens={command:{title:'Command Center',ey:'Autonomous engineering control'},new:{title:'New Mission',ey:'Intent → execution → verification'},config:{title:'Mission Configuration',ey:'Shape the autonomous run'},live:{title:'Live Autopilot',ey:'Mission · #VX-1042'},timeline:{title:'Execution Timeline',ey:'Traceable autonomous work'},failure:{title:'Recovery Detail',ey:'Failure isolated · repair active'},repos:{title:'Repositories',ey:'Connected engineering surface'},repo:{title:'Repository Detail',ey:'veytrix-engine · main'},artifacts:{title:'Artifacts',ey:'Verified build outputs'},artifact:{title:'Artifact Detail',ey:'APK · release candidate'},verify:{title:'Verification',ey:'Evidence before delivery'},history:{title:'Mission History',ey:'Auditable runs'},mission:{title:'Mission Detail',ey:'VX-1042 · verified'},ai:{title:'AI Engine',ey:'Deterministic first · escalation when required'},settings:{title:'Settings',ey:'Control plane preferences'},security:{title:'Security',ey:'Trust boundary & credentials'},about:{title:'System / About',ey:'VEYTRIX preview build'}};
const navItems=[['command','⌂','Command'],['new','＋','New Mission'],['live','◉','Live Run'],['repos','⌁','Repositories'],['artifacts','◇','Artifacts'],['history','≡','History'],['ai','✦','AI Engine'],['security','◈','Security'],['settings','⚙','Settings'],['about','i','About']];
const nav=document.getElementById('nav'),mobile=document.getElementById('mobileNav');nav.innerHTML=navItems.map(x=>`<button data-go="${x[0]}"><span class="icon">${x[1]}</span>${x[2]}</button>`).join('');mobile.innerHTML=navItems.slice(0,5).map(x=>`<button data-go="${x[0]}"><span class="mi">${x[1]}</span>${x[2]}</button>`).join('');
const S={};function card(x,cls=''){return `<div class="card ${cls}">${x}</div>`}function screen(id,body){return `<section class="screen" id="s-${id}">${body}</section>`}
S.command=()=>screen('command',`<div class="grid g2"><div class="card hero"><div><div class="row"><span class="pill green"><i class="dot"></i>READY</span><span class="pill violet">AUTONOMY 94%</span></div><div class="engine"><div class="core"></div></div></div><div class="hero-copy"><div class="eyebrow">Autonomous engine</div><h2>Command with intent.</h2><p>VEYTRIX plans, executes, repairs and verifies engineering work without turning your control center into a log viewer.</p><button class="cta" onclick="go('new')">Start mission</button></div></div><div class="grid"><div class="grid g2"><div class="card metric"><div class="label">Current mission</div><div class="value">VX-1042</div><div class="small">Release candidate · 3m 18s</div></div><div class="card metric"><div class="label">Engine state</div><div class="value">Stable</div><div class="small">● All providers healthy</div></div></div><div class="card"><div class="row"><b>System pulse</b><span class="pill green">NOMINAL</span></div><div class="list"><div class="item"><span>Repository</span><strong>main · clean</strong></div><div class="item"><span>Verification</span><strong>9 / 9 checks</strong></div><div class="item"><span>Artifact</span><strong>release.apk</strong></div></div></div><div class="card"><div class="row"><b>Recent activity</b><button class="ghost" onclick="toast('Activity stream opened')">View all</button></div><div class="list"><div class="item"><span><span class="pill green">VERIFIED</span> Build #1042</span><span class="small">2m</span></div><div class="item"><span><span class="pill violet">REPAIRED</span> Test suite</span><span class="small">8m</span></div></div></div></div></div>`);
function generic(id,title,body){S[id]=()=>screen(id,body)}
generic('new','New Mission',`<div class="grid g2">${card(`<div class="eyebrow">Mission intent</div><h2>What should VEYTRIX accomplish?</h2><div class="form"><div class="field"><label>Objective</label><textarea placeholder="Describe the engineering outcome in plain language…">Prepare the release candidate, run verification, repair failures and deliver the verified artifact.</textarea></div><button class="cta" onclick="go('config')">Continue to configuration</button></div>`)}${card(`<div class="row"><b>Autonomy policy</b><span class="pill green">SAFE</span></div><div class="list"><div class="item"><span>Plan before execution</span><span class="pill green">ON</span></div><div class="item"><span>Repair failed checks</span><span class="pill green">ON</span></div><div class="item"><span>Require verification</span><span class="pill green">ON</span></div></div>`)}</div>`);
generic('config','Mission Configuration',`<div class="grid g2">${card(`<div class="eyebrow">Scope</div><h2>Configure the run</h2><div class="form"><div class="field"><label>Repository</label><div class="select">veytrix-engine / main</div></div><div class="field"><label>Target</label><div class="select">Android release candidate</div></div><div class="row"><span>Allow autonomous repair</span><span class="switch on"><i></i></span></div><button class="cta" onclick="go('live')">Launch preview run</button></div>`)}${card(`<b>Execution policy</b><div class="steps" style="margin-top:12px"><div class="step done"><span class="n">1</span><span>Plan</span><span class="pill green">READY</span></div><div class="step active"><span class="n">2</span><span>Implement</span><span class="pill violet">AUTO</span></div><div class="step"><span class="n">3</span><span>Verify</span><span class="pill">GATED</span></div></div>`)}</div>`);
generic('live','Live Autopilot',`<div class="grid g2">${card(`<div class="row"><div><div class="eyebrow">Mission VX-1042</div><h2>Autopilot is executing</h2></div><span class="pill violet">ACTIVE</span></div><div class="steps" style="margin-top:14px">${['Intent','Plan','Implement','Build','Test','Repair','Verify','Artifact','Deliver'].map((x,i)=>`<div class="step ${i<4?'done':''} ${i===4?'active':''}"><span class="n">${i+1}</span><span>${x}</span><span class="small">${i<4?'Complete':i===4?'Running':'Queued'}</span></div>`).join('')}</div>`)}${card(`<div class="row"><b>Run health</b><span class="pill green">NOMINAL</span></div><div class="metric"><div class="label">Autonomy confidence</div><div class="value">94%</div><div class="bar"><i style="width:94%"></i></div></div><div class="metric"><div class="label">Elapsed</div><div class="value">03:18</div></div><button class="primary" onclick="go('timeline')">Open execution timeline</button>`)}</div>`);
generic('timeline','Execution Timeline',`<div class="grid g2">${card(`<div class="eyebrow">Trace</div><h2>Every autonomous decision, visible</h2><div class="timeline"><div class="event done"><b>Intent normalized</b><div class="small">Mission objective converted into executable constraints.</div></div><div class="event done"><b>Plan generated</b><div class="small">9 execution steps established.</div></div><div class="event done"><b>Build completed</b><div class="small">Release candidate generated successfully.</div></div><div class="event"><b>Verification running</b><div class="small">9 checks in progress.</div></div></div>`)}${card(`<b>Live event payload</b><div class="code" style="margin-top:12px">{
  "mission":"VX-1042",
  "stage":"verify",
  "status":"running",
  "checks":9,
  "repair":"enabled"
}</div>`)}</div>`);
generic('failure','Recovery Detail',`<div class="grid g2">${card(`<span class="pill amber">RECOVERING</span><h2>Verification failure isolated</h2><p class="small">Mock failure: dependency lock mismatch. VEYTRIX identified the failing constraint and prepared a bounded repair.</p><div class="code">Expected: lockfile v17
Found:    lockfile v16
Repair:   regenerate + rebuild</div><button class="cta" onclick="toast('Repair accepted in preview')">Accept repair</button>`)}${card(`<b>Recovery policy</b><div class="list"><div class="item"><span>Scope limited</span><span class="pill green">YES</span></div><div class="item"><span>Destructive action</span><span class="pill green">BLOCKED</span></div><div class="item"><span>Re-verification</span><span class="pill amber">REQUIRED</span></div></div>`)}</div>`);
const simple={repos:['Repositories',['veytrix-engine','nexusnova-app','mobile-client']],artifacts:['Artifacts',['release.apk','mapping.txt','verification.json']],history:['Mission History',['VX-1042 · Verified','VX-1039 · Repaired','VX-1034 · Delivered']],ai:['AI Engine',['Deterministic Router','Planner','Repair Agent','Verifier']],security:['Security',['Credential vault','Permission boundaries','Audit trail']],settings:['Settings',['Autonomy policy','Notifications','Appearance']],about:['System / About',['VEYTRIX Preview','Autonomy Core v0.9','Interactive design prototype']]};
Object.entries(simple).forEach(([id,[title,items]])=>generic(id,title,`<div class="grid g2">${card(`<div class="eyebrow">${screens[id].ey}</div><h2>${title}</h2><div class="list">${items.map((x,i)=>`<div class="item"><span>${x}</span><span class="pill ${i===0?'violet':'green'}">${i===0?'OPEN':'READY'}</span></div>`).join('')}</div>`)}${card(`<div class="eyebrow">Control surface</div><h2>Designed for depth</h2><p class="small">This preview uses interactive mock state only. No production APIs, GitHub actions or AI calls are connected.</p><button class="primary" onclick="toast('Preview interaction confirmed')">Interact</button>`)}</div>`));
generic('repo','Repository Detail',`<div class="grid g2">${card(`<div class="row"><div><div class="eyebrow">Repository</div><h2>veytrix-engine</h2></div><span class="pill green">CLEAN</span></div><div class="list"><div class="item"><span>Branch</span><strong>main</strong></div><div class="item"><span>Changes</span><strong>0 pending</strong></div><div class="item"><span>Last build</span><strong>#1042</strong></div></div>`)}${card(`<b>Latest commit</b><div class="code" style="margin-top:12px">8f4d1c2  release: candidate build
9 checks passed · artifact attached</div>`)}</div>`);
generic('artifact','Artifact Detail',`<div class="grid g2">${card(`<div class="artifact"><div class="artifact-visual"><b>APK</b></div><div><div class="eyebrow">Verified artifact</div><h2>release.apk</h2><div class="small">32.8 MB · SHA-256 verified</div></div></div><button class="cta" style="margin-top:18px" onclick="toast('Artifact delivery simulated')">Simulate delivery</button>`)}${card(`<b>Evidence</b><div class="list"><div class="item"><span>Build</span><span class="pill green">PASSED</span></div><div class="item"><span>Tests</span><span class="pill green">9 / 9</span></div><div class="item"><span>Signature</span><span class="pill green">VALID</span></div></div>`)}</div>`);
generic('verify','Verification',`<div class="grid g3">${['Build integrity','Test suite','Artifact signature','Dependency lock','Manifest','Permissions','Security scan','Smoke test','Delivery gate'].map((x,i)=>card(`<div class="row"><b>${x}</b><span class="pill green">PASS</span></div><div class="small" style="margin-top:9px">Evidence ${i+1} recorded</div>`)).join('')}</div>`);
generic('mission','Mission Detail',`<div class="grid g2">${card(`<span class="pill green">VERIFIED</span><h2>VX-1042</h2><p class="small">Release candidate completed with autonomous repair and final verification.</p><button class="primary" onclick="go('artifact')">View artifact</button>`)}${card(`<b>Outcome</b><div class="list"><div class="item"><span>Stages</span><strong>9 / 9</strong></div><div class="item"><span>Repairs</span><strong>1</strong></div><div class="item"><span>Artifact</span><strong>release.apk</strong></div></div>`)}</div>`);
Object.entries(S).forEach(([id,fn])=>document.getElementById('screens').insertAdjacentHTML('beforeend',fn()));
function go(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById('s-'+id)?.classList.add('active');document.querySelectorAll('[data-go]').forEach(x=>x.classList.toggle('active',x.dataset.go===id));document.getElementById('title').textContent=screens[id]?.title||'VEYTRIX';document.getElementById('eyebrow').textContent=screens[id]?.ey||'Autonomous engineering control';window.scrollTo({top:0,behavior:'smooth'})}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(b.dataset.go)});go('command');
</script></body></html>
