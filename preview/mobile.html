te-columns:repeat(3,1fr);gap:7px}.card{min-width:0;min-height:0;background:linear-gradient(150deg,#151f2eee,#0c121bee);border:1px solid #fff1;border-radius:17px;padding:12px;box-shadow:0 14px 34px #0005}.hero{display:grid;grid-template-rows:125px auto auto;gap:7px;text-align:center}.orb{width:108px;height:108px;margin:auto;border-radius:50%;position:relative;background:radial-gradient(circle at 34% 27%,#fff 0 3%,#aaa2ff 11%,#4c44bf 39%,#15182d 65%,#080b12 72%);box-shadow:0 0 40px #8174ff50,inset -17px -20px 34px #0009}.orb:before,.orb:after{content:"";position:absolute;inset:-11px;border:1px solid #8b7cff55;border-radius:50%;transform:rotate(24deg)}.orb:after{inset:-22px;border-color:#52d7ff30;transform:rotate(-25deg) scaleX(.72)}h2{font-size:18px;margin:0}.muted{color:var(--m)}.label{font-size:9px;color:var(--m);text-transform:uppercase;letter-spacing:.08em}.big{font-size:25px;font-weight:850;letter-spacing:-.05em}.mini{font-size:10px}.row{display:flex;align-items:center;justify-content:space-between;gap:7px}.pill{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:99px;padding:4px 7px;font-size:9px;color:var(--m);white-space:nowrap}.green{color:var(--g)}.violet{color:#c0baff}.cyan{color:var(--c)}.amber{color:var(--a)}.red{color:var(--r)}.primary,.ghost{border-radius:11px;padding:10px;width:100%}.primary{background:linear-gradient(135deg,#8b7cff,#5b51d9);font-weight:800}.ghost{border:1px solid var(--line);background:#ffffff05}.progress{height:5px;background:#fff1;border-radius:99px;margin-top:7px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--v),var(--c))}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.step{padding:8px;border:1px solid var(--line);border-radius:10px;background:#ffffff03;min-width:0}.step.active{border-color:#8b7cff55;background:#8b7cff0b}.step b{display:block;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.step span{font-size:8px;co </style></head><body><main class="app"><header class="top"><div class="brand"><span class="logo">V</span>VEYTRIX</div><span class="status">● NOMINAL</span></header><section class="stage" id="stage"></section><nav class="nav" id="nav"></nav><div class="toast" id="toast"></div></main><script>
const nav=[['home','⌂','Home'],['missions','◉','Missions'],['repos','⌁','Repos'],['artifacts','◇','Artifacts'],['more','⋯','More']];const stage=document.getElementById('stage'),navEl=document.getElementById('nav');navEl.innerHTML=nav.map(n=>`<button id="nav-${n[0]}" onclick="go('${n[0]}')"><b>${n[1]}</b>${n[2]}</button>`).join('');const C=x=>`<div class="card">${x}</div>`;const H=(t,e,b)=>`<div class="head">${b?`<div class="headrow"><button class="back" onclick="go('${b}')">‹</button><div><div class="ey">${e}</div><h1>${t}</h1></div></div>`:`<div class="ey">${e}</div><h1>${t}</h1>`}</div>`;const section=(id,h,b)=>`<section class="screen" id="s-${id}">${h}<div class="content">${b}</div></section>`;
const screens={
home:()=>section('home',H('Command Center','Autonomous engineering control'),`<div class="grid2"><div class="card hero"><div class="orb"></div><div><h2>Autopilot Core</h2><div class="muted mini">Ready for a new engineering mission</div></div><button class="primary" onclick="go('new')">＋ New Mission</button></div><div class="content"><div class="grid2">${C('<div class="label">Active</div><div class="big">01</div><div class="green mini">RUNNING</div>')}${C('<div class="label">Health</div><div class="big">98%</div><div class="cyan mini">VERIFIED</div>')}</div>${C('<div class="row"><b>Current mission</b><span class="pill violet">VX-1042</span></div><div class="mini" style="margin-top:6px">Repair authentication failure</div><div class="progress"><i style="width:72%"></i></div><div class="row mini muted" style="margin-top:4px"><span>Recovery</span><span>72%</span></div>')}</div></div>${C('<div class="row"><b>Autonomy pipeline</b><span class="pill green">7 / 9</span></div><div class="steps" style="margin-top:7px">'+['Intent','Plan','Implement','Build','Test','Repair','Verify','Artifact'].map((x,i)=>`<div class="step ${i<7?'active':''}"><span>0${i+1}</span><b>${x}</b></div>`).join('')+'</div>')}<div class="actions"><button class="ghost" onclick="go('live')">Live run</button><button class="ghost" onclick="go('history')">History</button></div>`),
missions:()=>section('missions',H('Missions','Intent → execution → delivery'),`<div class="grid2">${C('<div class="row"><b>VX-1042</b><span class="pill green">RUNNING</span></div><div class="mini muted" style="margin-top:6px">Repair authentication failure</div><div class="progress"><i style="width:72%"></i></div><button class="ghost" style="margin-top:7px" onclick="go(\'live\')">Open live run</button>')}${C('<div class="label">Today</div><div class="big">04</div><div class="green mini">Verified</div>')}</div>${C('<div class="row"><b>Recent missions</b><span class="pill">Audited</span></div><div class="list" style="margin-top:7px"><div class="item row"><b>VX-1041 · API migration</b><span class="green">Verified</span></div><div class="item row"><b>VX-1040 · Release build</b><span class="green">Delivered</span></div><div class="item row"><b>VX-1039 · Test repair</b><span class="amber">Waiting</span></div></div>')}<button class="primary" onclick="go('new')">＋ Create mission</button>`),

artifacts:()=>section('artifacts',H('Artifacts','Verified build outputs'),`<div class="grid2">${C('<div class="artifact">APK</div><div style="margin-top:6px"><b>veytrix-release.apk</b><div class="mini muted">v0.9.4 · 42.8 MB</div></div><button class="primary" style="margin-top:7px" onclick="go(\'artifact\')">Open artifact</button>')}${C('<div class="label">Verified</div><div class="big">12</div><div class="green mini">Evidence complete</div>')}</div>${C('<div class="row"><b>Latest outputs</b><span class="pill green">SIGNED</span></div><div class="list" style="margin-top:7px"><div class="item row"><b>release.apk</b><span class="green">Verified</span></div><div class="item row"><b>mapping.txt</b><span class="green">Verified</span></div><div class="item row"><b>test-report.xml</b><span class="green">Passed</span></div></div>')}`),

timeline:()=>section('timeline',H('Execution Timeline','Traceable autonomous work','live'),`${C('<div class="list"><div class="item row"><b>Intent accepted · 00:12</b><span class="green">OK</span></div><div class="item row"><b>Plan generated · 00:24</b><span class="green">OK</span></div><div class="item row"><b>Patch applied · 01:46</b><span class="green">OK</span></div><div class="item row"><b>Build passed · 02:38</b><span class="green">OK</span></div><div class="item row"><b>Test failed · 03:12</b><span class="amber">FAIL</span></div><div class="item row"><b>Repair active · 04:18</b><span class="violet">ACTIVE</span></div></div>')} ${C('<div class="code">TRACE VX-1042\ncommit 7d91a2e\nchecks 18/18\nrepair attempt 1/3</div>')}`),
failure:()=>section('failure',H('Recovery','Failure isolated · repair active','live'),`${C('<div class="row"><b>Auth token mismatch</b><span class="pill amber">RECOVERING</span></div><div class="mini muted" style="margin-top:6px">Refresh-token claim mismatch detected by test gate.</div><div class="code" style="margin-top:7px">AUTH_REFRESH → 401\nrepair candidate identified</div>')}<div class="grid2">${C('<div class="label">Attempt</div><div class="big">01 / 03</div><div class="green mini">Patch ready</div>')}${C('<div class="label">Confidence</div><div class="big">94%</div><div class="cyan mini">Evidence linked</div>')}</div>${C('<div class="check"><b>Patch scope constrained</b><span class="green">✓</span></div><div class="check"><b>Regression target preserved</b><span class="green">✓</span></div><div class="check"><b>Build gate armed</b><span class="green">✓</span></div>')}<button class="primary" onclick="go('verify')">Continue to verification</button>`),

Object.values(screens).forEach(fn=>stage.insertAdjacentHTML('beforeend',fn()));function go(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));const el=document.getElementById('s-'+id);if(el)el.classList.add('active');const root=['home','missions','repos','artifacts','more'].includes(id)?id:(['new','config','live','timeline','failure','verify'].includes(id)?'missions':id==='repo'?'repos':id==='artifact'?'artifacts':['ai','security','settings','history','about'].includes(id)?'more':'home');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('selected',b.id==='nav-'+root))}function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>x.classList.remove('show'),1600)}go('home');
