<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a10">
<title>VEYTRIX — Mobile Command Center</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070a10;color:#f3f6fb;font:14px/1.4 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit;color:inherit;border:0}.app{height:100dvh;min-height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);background:radial-gradient(circle at 70% -5%,#202952 0,#0b101a 36%,#070a10 72%)}.top{height:64px;flex:0 0 64px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #ffffff08}.brand{display:flex;align-items:center;gap:9px}.mark{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-weight:900;background:linear-gradient(135deg,#b7afff,#6256ee);box-shadow:0 0 24px #7569ff45}.eyebrow{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#68758a}.title{font-size:17px;font-weight:750;letter-spacing:-.03em}.iconbtn{width:38px;height:38px;border-radius:12px;background:#ffffff07;border:1px solid #ffffff0c;display:grid;place-items:center}.content{flex:1;min-height:0;padding:12px 14px 8px;display:flex;flex-direction:column;gap:10px;overflow:hidden}.statusrow{display:flex;justify-content:space-between;align-items:center}.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid #ffffff10;border-radius:99px;padding:5px 9px;font-size:10px;color:#9ba7ba;background:#ffffff04}.pill.green{color:#5ee6a8;border-color:#5ee6a82a;background:#5ee6a808}.dot{width:6px;height:6px;border-radius:50%;background:#5ee6a8;box-shadow:0 0 10px #5ee6a8}.engineCard{flex:1;min-height:0;border-radius:24px;border:1px solid #ffffff0c;background:radial-gradient(circle at 50% 29%,#7569ff1b,transparent 31%),linear-gradient(180deg,#111825,#0b1018);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 16px;box-shadow:0 20px 55px #0008;overflow:hidden}.engine{width:min(42vw,158px);height:min(42vw,158px);flex:0 0 auto;border-radius:50%;position:relative;background:radial-gradient(circle at 35% 27%,#e8e5ff 0 3%,#a39aff 11%,#463cb4 38%,#171a35 64%,#080b12 73%);box-shadow:0 0 50px #796dff40,inset -20px -26px 45px #000a,inset 8px 7px 20px #fff3;animation:f 4.5s ease-in-out infinite}.engine:before,.engine:after{content:"";position:absolute;inset:-14px;border-radius:50%;border:1px solid #8b7cff3d;transform:rotate(25deg)}.engine:after{inset:-28px;border-color:#52d7ff20;transform:rotate(-30deg) scaleX(.76)}.core{position:absolute;inset:31%;border-radius:50%;background:radial-gradient(circle,#fff,#c1baff 21%,#7c70ff 48%,#4b42bd 71%,transparent 73%);box-shadow:0 0 30px #9c93ff}.copy{text-align:center;margin-top:13px;max-width:330px}.copy .eyebrow{margin-bottom:3px}.copy h1{font-size:24px;line-height:1.05;margin:0 0 7px;letter-spacing:-.05em}.copy p{font-size:12px;line-height:1.45;color:#8996aa;margin:0}.cta{margin-top:13px;width:100%;height:46px;border-radius:14px;font-weight:750;background:linear-gradient(135deg,#8b7cff,#5b51dc);box-shadow:0 13px 28px #6b60ff30}.pulse{height:78px;flex:0 0 78px;border-radius:18px;border:1px solid #ffffff09;background:#0e141e;padding:11px}.pulsehead{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700}.nominal{font-size:9px;color:#5ee6a8;border:1px solid #5ee6a82a;border-radius:99px;padding:4px 7px}.pulsegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.stat{border-radius:10px;background:#ffffff04;padding:6px 7px}.stat span{display:block;color:#68758a;font-size:8px}.stat b{font-size:10px}.nav{height:64px;flex:0 0 64px;margin:0 10px 8px;border:1px solid #ffffff10;border-radius:19px;background:#0d131de8;backdrop-filter:blur(22px);display:grid;grid-template-columns:repeat(5,1fr);padding:5px;box-shadow:0 14px 45px #000a}.nav button{background:transparent;color:#657287;border-radius:14px;font-size:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.nav button.active{color:#fff;background:#8b7cff12}.ni{font-size:16px}@keyframes f{50%{transform:translateY(-5px) rotate(1deg)}}
@media(max-height:700px){.top{height:56px;flex-basis:56px}.content{padding-top:8px;gap:7px}.engine{width:125px;height:125px}.copy{margin-top:7px}.copy h1{font-size:21px}.copy p{font-size:11px}.cta{margin-top:8px;height:42px}.pulse{height:66px;flex-basis:66px}.pulsegrid{margin-top:5px}.nav{height:58px;flex-basis:58px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="mark">V</div><div><div class="eyebrow">Autonomous engineering control</div><div class="title">Command Center</div></div></div><button class="iconbtn">⌘</button></header>
<main class="content">
<div class="statusrow"><span class="pill green"><i class="dot"></i>ENGINE READY</span><span class="pill">AUTONOMY 94%</span></div>
<section class="engineCard"><div class="engine"><div class="core"></div></div><div class="copy"><div class="eyebrow">Autonomous engine</div><h1>Command with intent.</h1><p>Plan, execute, repair and verify engineering work from one focused mobile control center.</p><button class="cta" onclick="this.textContent='Mission queued · preview';setTimeout(()=>this.textContent='Start mission',1600)">Start mission</button></div></section>
<section class="pulse"><div class="pulsehead"><span>System pulse</span><span class="nominal">NOMINAL</span></div><div class="pulsegrid"><div class="stat"><span>Repository</span><b>main · clean</b></div><div class="stat"><span>Checks</span><b>9 / 9</b></div><div class="stat"><span>Artifact</span><b>release.apk</b></div></div></section>
</main>
<nav class="nav"><button class="active"><span class="ni">⌂</span>Command</button><button><span class="ni">＋</span>Mission</button><button><span class="ni">◉</span>Run</button><button><span class="ni">◇</span>Artifacts</button><button><span class="ni">⚙</span>Settings</button></nav>
</div>
</body></html>
