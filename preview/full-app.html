const names=Object.fromEntries(items.map(x=>[x[0],x[2]]));const all={...screens};
function navHtml(){return items.map(x=>`<button data-go="${x[0]}"><span class="ico">${x[1]}</span><span>${x[2]}</span></button>`).join('')}
sideNav.innerHTML=navHtml();drawerNav.innerHTML=navHtml();mobileNav.innerHTML=items.slice(0,5).map(x=>`<button data-go="${x[0]}"><span class="ico">${x[1]}</span><span>${x[2].split(' ')[0]}</span></button>`).join('');
Object.entries(all).forEach(([k,v])=>{const el=document.createElement('section');el.className='screen';el.id='s-'+k;el.innerHTML=v;screensEl.appendChild(el)});
function go(k){document.querySelectorAll('.screen').forEach(e=>e.classList.remove('active'));document.querySelector('#s-'+k).classList.add('active');document.querySelectorAll('[data-go]').forEach(b=>b.classList.toggle('active',b.dataset.go===k));topTitle.textContent=names[k]||'Command Center';crumb.textContent=(names[k]||'Command Center').toUpperCase();drawer.classList.remove('open');location.hash=k}
document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));hamb.onclick=()=>drawer.classList.add('open');close.onclick=()=>drawer.classList.remove('open');drawer.onclick=e=>{if(e.target===drawer)drawer.classList.remove('open')};
const initial=location.hash.slice(1);go(all[initial]?initial:'command');
