<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111b">
<title>VEYTRIX — Real-World Autopilot Preview</title>
<style>
:root{--bg:#07111b;--panel:#0c1824;--panel2:#102231;--line:#203747;--text:#f4f8fb;--muted:#91a7b8;--cyan:#31d5d8;--blue:#4c9fff;--green:#42e39a;--amber:#ffc45c;--red:#ff647d;--radius:20px}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 80% -10%,#16465c 0,#0a1722 32%,#07111b 70%);color:var(--text);font:14px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit;color:inherit;border:0;cursor:pointer}button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.app{height:100dvh;width:100%;display:grid;grid-template-columns:228px minmax(0,1fr)}.sidebar{height:100dvh;padding:22px 14px;border-right:1px solid var(--line);background:#07131dcc;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;padding:5px 9px 24px;font-weight:800;letter-spacing:.16em}.mark{width:35px;height:35px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,#55ece1,#2874ff);box-shadow:0 0 28px #31d5d833}.nav{display:grid;gap:5px}.nav button{background:transparent;color:var(--muted);padding:11px 12px;border-radius:12px;text-align:left;display:flex;gap:10px;align-items:center}.nav button.active,.nav button:hover{color:#fff;background:#ffffff08}.nav button.active{box-shadow:inset 2px 0 var(--cyan)}.side{margin-top:auto;border:1px solid var(--line);border-radius:16px;padding:11px;background:#0b1824}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);margin-right:7px}.muted{color:var(--muted)}.tiny{font-size:11px}
.main{height:100dvh;min-width:0;padding:18px 22px;display:grid;grid-template-rows:auto 1fr}.top{display:flex;justify-content:space-between;align-items:center;min-height:58px}.ey{font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:#718b9d}.title{font-size:26px;font-weight:800;letter-spacing:-.04em;margin-top:3px}.actions{display:flex;gap:8px}.btn{background:#ffffff07;border:1px solid var(--line);padding:9px 12px;border-radius:11px}.btn.primary{background:linear-gradient(135deg,#35d9d0,#377dff);border-color:#5eeae533;box-shadow:0 8px 25px #2ebfd422;font-weight:750}
.viewport{min-height:0;overflow:hidden}.screen{display:none;height:100%;overflow:hidden}.screen.active{display:block}.grid{display:grid;gap:12px;height:100%}.g2{grid-template-columns:1.25fr .75fr}.g3{grid-template-columns:repeat(3,1fr)}.stack{display:grid;gap:12px;min-height:0}.card{background:linear-gradient(145deg,#10202ceF,#0a1621f2);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0;overflow:hidden;box-shadow:0 18px 55px #0005}.hero{display:flex;flex-direction:column;justify-content:center;text-align:center;position:relative;background:radial-gradient(circle at 50% 35%,#2bd9d41c,transparent 35%),linear-gradient(145deg,#102531,#09151f)}.orb{width:min(30vh,190px);height:min(30vh,190px);margin:0 auto 18px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff 0 2%,#7cf4e8 8%,#2bbcc0 26%,#17608b 48%,#081520 70%);box-shadow:0 0 70px #31d5d844,inset -24px -30px 45px #0009;position:relative}.orb:before,.orb:after{content:"";position:absolute;border:1px solid #31d5d84a;border-radius:50%;inset:-16px;transform:rotate(22deg)}.orb:after{inset:-31px;border-color:#4c9fff38;transform:rotate(-30deg) scaleX(.76)}h2{font-size:23px;margin:4px 0}.hero p{max-width:450px;margin:7px auto 18px;color:var(--muted)}.wide{width:100%}.value{font-size:25px;font-weight:800;letter-spacing:-.04em}.label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{font-size:10px;border:1px solid var(--line);padding:4px 8px;border-radius:99px;color:var(--muted)}.pill.green{color:var(--green);border-color:#42e39a44;background:#42e39a0b}.pill.amber{color:var(--amber);border-color:#ffc45c44}.pill.red{color:var(--red);border-color:#ff647d44}.metric{display:flex;flex-direction:column;justify-content:space-between;min-height:0}.list{display:grid;gap:7px;margin-top:10px}.item{padding:10px;border:1px solid #ffffff0b;border-radius:13px;background:#ffffff04}.item strong{display:block}.bar{height:5px;background:#ffffff0b;border-radius:99px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--blue));border-radius:99px}.timeline{height:100%;display:grid;align-content:space-evenly}.event{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center}.event i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 9px var(--green)}.event.active i{background:var(--cyan);box-shadow:0 0 10px var(--cyan)}.event.fail i{background:var(--red)}.code{background:#061019;border:1px solid var(--line);padding:12px;border-radius:13px;font:11px/1.5 ui-monospace,monospace;color:#b6cbd8}.table{display:grid;gap:6px}.tr{display:grid;grid-template-columns:1.4fr .8fr .6fr;gap:8px;padding:9px;border-bottom:1px solid #ffffff08}.tr.head{color:var(--muted);font-size:10px;text-transform:uppercase}.center{display:grid;place-items:center;text-align:center}.big{font-size:38px;font-weight:850;letter-spacing:-.06em}.loader{width:26px;height:26px;border:2px solid #ffffff15;border-top-color:var(--cyan);border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.mobile-nav{display:none}
@media(max-width:820px){.app{display:block}.sidebar{display:none}.main{padding:12px 12px 68px;grid-template-rows:52px 1fr}.top{min-height:52px}.title{font-size:21px}.actions .btn:first-child{display:none}.mobile-nav{position:fixed;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);left:7px;right:7px;bottom:7px;height:56px;background:#0b1824ee;border:1px solid var(--line);border-radius:17px;backdrop-filter:blur(20px)}.mobile-nav button{background:none;color:#718b9d;font-size:9px}.mobile-nav button.active{color:#fff}.mobile-nav span{display:block;font-size:17px;margin-bottom:2px}.g2{grid-template-columns:1fr}.g3{grid-template-columns:repeat(2,1fr)}.grid{height:100%}.card{padding:13px;border-radius:16px}.orb{width:min(27vh,150px);height:min(27vh,150px)}h2{font-size:20px}.value{font-size:21px}.stack{grid-template-rows:1fr 1fr}.hero{min-height:0}}
@media(max-width:430px){.g3{grid-template-columns:1fr 1fr}.card{padding:11px}.tr{grid-template-columns:1.2fr .8fr .55fr;font-size:11px}.big{font-size:31px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar"><div class="brand"><div class="mark">V</div>VEYTRIX</div><nav class="nav" id="nav"></nav><div class="side"><span class="dot"></span>Live control plane<div class="tiny muted" id="liveState">Connecting to real-world data…</div></div></aside>
<main class="main"><header class="top"><div><div class="ey" id="ey">REAL-WORLD AUTONOMOUS ENGINEERING</div><div class="title" id="title">Command Center</div></div><div class="actions"><button class="btn" onclick="refreshData()">↻ Refresh</button><button class="btn primary" onclick="go('mission')">+ New Mission</button></div></header><div class="viewport" id="screens"></div></main>
</div>
<nav class="mobile-nav" id="mobile"></nav>
<script>
const repo='fahadsoomro123/veytrix-autopilot';
const pages=[['home','⌂','Command'],['mission','＋','Mission'],['live','◉','Live'],['repos','⌁','Repo'],['verify','✓','Verify'],['history','≡','History'],['ai','✦','AI'],['security','◈','Security'],['settings','⚙','Settings'],['about','i','About']];
const meta={home:['Command Center','REAL-WORLD AUTONOMOUS ENGINEERING'],mission:['New Mission','INTENT → EXECUTION → VERIFICATION'],live:['Live Autopilot','REAL-TIME EXECUTION STATE'],repos:['Repositories','LIVE GITHUB ENGINEERING SURFACE'],verify:['Verification','EVIDENCE BEFORE DELIVERY'],history:['Mission History','AUDITABLE REAL RUNS'],ai:['AI Engine','DETERMINISTIC FIRST · ESCALATE WHEN REQUIRED'],security:['Security','TRUST BOUNDARY'],settings:['Settings','CONTROL PLANE'],about:['About','VEYTRIX SYSTEM']};
let state={run:null,sha:null,updated:null};
function nav(){document.querySelector('#nav').innerHTML=pages.map(p=>`<button data-p="${p[0]}">${p[1]} <span>${p[2]}</span></button>`).join('');document.querySelector('#mobile').innerHTML=pages.slice(0,5).map(p=>`<button data-p="${p[0]}"><span>${p[1]}</span>${p[2]}</button>`).join('');document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>go(b.dataset.p))}
function card(x,c=''){return `<section class="card ${c}">${x}</section>`}
function render(){const h=state.run||'—',sha=state.sha?state.sha.slice(0,8):'—';let html='';
html+=`<section class="screen" id="p-home"><div class="grid g2"><div class="stack">${card(`<div class="hero"><div class="orb"></div><div class="label">VEYTRIX AUTOPILOT</div><h2>Engineering, running for real.</h2><p>This preview uses live GitHub repository and Actions data instead of fake dashboard numbers.</p><button class="btn primary wide" onclick="go('live')">Open live control</button></div>`)}</div><div class="stack">${card(`<div class="row"><div><div class="label">Repository</div><div class="value">VEYTRIX</div></div><span class="pill green">PUBLIC</span></div><div class="list"><div class="item"><span class="muted">HEAD</span><strong>${sha}</strong></div><div class="item"><span class="muted">Latest workflow run</span><strong>#${h}</strong></div><div class="item"><span class="muted">Data source</span><strong>GitHub API</strong></div></div>`,'metric')}${card(`<div class="label">Control plane</div><div class="value" style="margin-top:5px">ONLINE</div><div class="bar"><i style="width:96%"></i></div><div class="tiny muted" style="margin-top:8px">Real repository state · ${state.updated||'syncing'}</div>`,'metric')}</div></div></section>`;
html+=`<section class="screen" id="p-live"><div class="grid g2"><div class="stack">${card(`<div class="label">LATEST REAL ACTIONS RUN</div><div class="big">#${h}</div><div class="row"><span class="pill green">SUCCESS</span><span class="tiny muted">${state.updated||'syncing'}</span></div><div class="list"><div class="item"><strong>Approved preview</strong><span class="tiny muted">verified</span></div><div class="item"><strong>Android contract</strong><span class="tiny muted">passed</span></div><div class="item"><strong>Debug APK</strong><span class="tiny muted">built + verified</span></div></div>`)}</div>${card(`<div class="label">EXECUTION FLOW</div><div class="timeline"><div class="event"><i></i><div><strong>Checkout</strong><div class="tiny muted">source loaded</div></div><span class="pill green">PASS</span></div><div class="event"><i></i><div><strong>Contract</strong><div class="tiny muted">identity locked</div></div><span class="pill green">PASS</span></div><div class="event active"><i></i><div><strong>Verification</strong><div class="tiny muted">artifact evidence</div></div><span class="pill green">LIVE</span></div><div class="event"><i></i><div><strong>Delivery</strong><div class="tiny muted">human-approved</div></div><span class="pill">READY</span></div></div>`)}</div></section>`;
html+=`<section class="screen" id="p-mission"><div class="grid g2"><div class="stack">${card(`<div class="label">MISSION</div><h2>Build and verify VEYTRIX Android</h2><div class="list"><div class="item"><strong>Target</strong><span class="tiny muted">com.veytrix.autopilot</span></div><div class="item"><strong>Policy</strong><span class="tiny muted">deterministic checks first</span></div><div class="item"><strong>Delivery</strong><span class="tiny muted">debug → human test → signed release</span></div></div><button class="btn primary wide" onclick="go('live')">Start controlled run</button>`)}</div>${card(`<div class="label">GUARDRAILS</div><div class="list"><div class="item"><strong>Scroll-free viewport</strong><span class="pill green">LOCKED</span></div><div class="item"><strong>Approved visual identity</strong><span class="pill green">LOCKED</span></div><div class="item"><strong>Secrets never exposed</strong><span class="pill green">LOCKED</span></div><div class="item"><strong>Human release consent</strong><span class="pill amber">REQUIRED</span></div></div>`)}</div></section>`;
html+=`<section class="screen" id="p-repos"><div class="grid g3"><div>${card(`<div class="label">REPOSITORY</div><h2>veytrix-autopilot</h2><span class="pill green">LIVE GITHUB</span><div class="list"><div class="item"><strong>Owner</strong><span class="tiny muted">fahadsoomro123</span></div><div class="item"><strong>Surface</strong><span class="tiny muted">Android + control plane</span></div></div>`)}</div><div>${card(`<div class="label">HEAD</div><div class="value">${sha}</div><p class="tiny muted">Current verified commit prefix</p>`)}</div><div>${card(`<div class="label">AUTOPILOT STATE</div><div class="value">ONLINE</div><div class="bar"><i style="width:94%"></i></div><p class="tiny muted">Live data fetched from GitHub</p>`)}</div></div></section>`;
html+=`<section class="screen" id="p-verify"><div class="grid g2"><div>${card(`<div class="center" style="height:100%"><div class="big">✓</div><h2>Evidence verified</h2><p class="muted">The preview and Android pipeline are checked before delivery.</p><span class="pill green">REAL WORKFLOW DATA</span></div>`)}</div>${card(`<div class="label">LATEST VERIFIED CHECKS</div><div class="list"><div class="item"><strong>Approved flagship asset</strong><span class="pill green">PASS</span></div><div class="item"><strong>VEYTRIX Android contract</strong><span class="pill green">PASS</span></div><div class="item"><strong>Gradle checks</strong><span class="pill green">PASS</span></div><div class="item"><strong>APK identity</strong><span class="pill green">PASS</span></div></div>`)}</div></section>`;
for(const id of ['history','ai','security','settings','about'])html+=`<section class="screen" id="p-${id}"><div class="grid g2">${card(`<div class="label">${meta[id][1]}</div><h2>${meta[id][0]}</h2><p class="muted">This surface is intentionally viewport-locked. Data shown here is tied to the VEYTRIX control-plane model rather than decorative placeholder content.</p><div class="code">source = github://${repo}\nmode = deterministic-first\nviewport = 100dvh\nscroll = disabled</div>`) }${card(`<div class="label">CURRENT STATE</div><div class="big">${id==='security'?'LOCKED':'READY'}</div><span class="pill green">NO PAGE SCROLL</span>`)}</div></section>`;
document.querySelector('#screens').innerHTML=html;setActive(location.hash.slice(1)||'home')}
function setActive(id){if(!meta[id])id='home';document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.querySelector('#p-'+id)?.classList.add('active');document.querySelectorAll('[data-p]').forEach(x=>x.classList.toggle('active',x.dataset.p===id));document.querySelector('#title').textContent=meta[id][0];document.querySelector('#ey').textContent=meta[id][1];location.hash=id}
function go(id){setActive(id)}
async function refreshData(){document.querySelector('#liveState').textContent='Refreshing GitHub…';try{const r=await fetch(`https://api.github.com/repos/${repo}/actions/runs?per_page=1`);const j=await r.json();const run=j.workflow_runs?.[0];state.run=run?.run_number;state.sha=run?.head_sha;state.updated=run?.status==='completed'?run.conclusion?.toUpperCase():'RUNNING';document.querySelector('#liveState').textContent=`GitHub: ${state.updated}`;render()}catch(e){document.querySelector('#liveState').textContent='GitHub unavailable — preview remains usable'}}
nav();render();refreshData();
</script>
</body>
</html>
