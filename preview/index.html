<style>

*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07090d;color:var(--ink);font:14px/1.35 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}body:before{content:"";position:fixed;inset:-20%;pointer-events:none;background:radial-gradient(circle at 15% 0%,#5264ff18,transparent 27%),radial-gradient(circle at 88% 20%,#26dce21b,transparent 25%),radial-gradient(circle at 50% 110%,#7b4dff14,transparent 30%);filter:blur(30px)}button{font:inherit;color:inherit;border:0;cursor:pointer}button:active{transform:translateY(1px) scale(.985)}
.app{height:100dvh;width:100%;display:grid;grid-template-columns:250px minmax(0,1fr);position:relative;isolation:isolate}.sidebar{height:100dvh;padding:22px 14px;border-right:1px solid var(--edge);background:linear-gradient(180deg,#10151ce8,#080b10ee);backdrop-filter:blur(24px);display:flex;flex-direction:column;box-shadow:20px 0 70px #0007}.brand{display:flex;align-items:center;gap:11px;padding:3px 9px 25px;font-weight:850;letter-spacing:.18em}.logo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-weight:950;background:linear-gradient(145deg,#eaffff 0%,#72dfe9 17%,#526fff 58%,#261d59 100%);color:#071016;box-shadow:inset 2px 2px 5px #fff9,inset -7px -8px 12px #0007,0 10px 35px #52dbe644;transform:perspective(400px) rotateX(5deg)}.nav{display:grid;gap:6px}.nav button{position:relative;display:flex;align-items:center;gap:12px;padding:12px 13px;border-radius:15px;background:transparent;color:#8e98a5;text-align:left;transition:.22s}.nav button b{width:25px;height:25px;display:grid;place-items:center;border-radius:9px;font-size:13px;background:#ffffff08;border:1px solid #ffffff0c}.nav button.active{color:#fff;background:linear-gradient(135deg,#ffffff10,#ffffff04);box-shadow:inset 0 1px #fff10,0 9px 24px #0005}.nav button.active:before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:8px;background:linear-gradient(#75f5ed,#6c8dff);box-shadow:0 0 15px #63e9f0}.nav button.active b{background:linear-gradient(145deg,#cfffff,#5edce6 45%,#657cff);color:#071016;box-shadow:inset 1px 1px 3px #fff8,0 5px 18px #54dfe633}.side{margin-top:auto;padding:14px;border:1px solid var(--edge);border-radius:18px;background:linear-gradient(145deg,#ffffff08,#ffffff03);box-shadow:inset 0 1px #fff0d}.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green);margin-right:7px}.tiny{font-size:11px}.muted{color:var(--muted)}
.main{height:100dvh;min-width:0;padding:16px 20px;display:grid;grid-template-rows:62px minmax(0,1fr)}.top{display:flex;justify-content:space-between;align-items:center;min-height:0}.ey{font-size:9px;font-weight:750;letter-spacing:.2em;color:#687484;text-transform:uppercase}.title{font-size:25px;font-weight:850;letter-spacing:-.045em;margin-top:3px}.actions{display:flex;gap:8px}.btn{position:relative;padding:10px 14px;border-radius:13px;background:linear-gradient(145deg,#ffffff0d,#ffffff04);border:1px solid #ffffff16;box-shadow:inset 0 1px #fff10,0 10px 25px #0006;color:#dfe5eb}.btn.primary{background:linear-gradient(145deg,#dffeff 0%,#6ce5ec 23%,#668cff 70%,#433f9a 100%);color:#061015;font-weight:850;border-color:#b9ffff55;box-shadow:inset 2px 2px 4px #fff9,inset -5px -7px 10px #18215a88,0 13px 30px #5e9cff30}.viewport{min-height:0;overflow:hidden}.screen{display:none;height:100%;overflow:hidden}.screen.active{display:block}.grid{height:100%;display:grid;gap:14px}.g2{grid-template-columns:1.15fr .85fr}.g3{grid-template-columns:repeat(3,1fr)}.stack{height:100%;display:grid;gap:14px;min-height:0}.card{position:relative;min-width:0;overflow:hidden;padding:17px;border:1px solid #ffffff18;border-radius:var(--radius);background:linear-gradient(145deg,#1b222be8 0%,#10151ce8 47%,#0b0f15ed 100%);box-shadow:var(--shadow),inset 0 1px #fff14;backdrop-filter:blur(24px)}.card:after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:linear-gradient(120deg,#ffffff0c,transparent 25%,transparent 72%,#ffffff05);mix-blend-mode:screen}.hero{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:radial-gradient(circle at 50% 38%,#6ee8f41c,transparent 25%),linear-gradient(145deg,#1c2730,#0b1016)}.hero h2{font-size:25px;margin:2px 0 7px;letter-spacing:-.045em}.hero p{max-width:470px;color:#8f9aa8;margin:0 0 19px}.label{font-size:9px;font-weight:800;letter-spacing:.17em;text-transform:uppercase;color:#74808f}.value{font-size:25px;font-weight:850;letter-spacing:-.045em}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:99px;border:1px solid #ffffff16;background:#ffffff06;color:#9da7b4;font-size:9px;font-weight:750}.pill.green{color:var(--green);border-color:#55e2a033;background:#55e2a00d}.pill.amber{color:var(--amber);border-color:#f4c86a33}.pill.red{color:var(--red);border-color:#ff718733}.list{display:grid;gap:8px;margin-top:12px}.item{position:relative;padding:11px 12px;border:1px solid #ffffff0b;border-radius:15px;background:linear-gradient(145deg,#ffffff08,#ffffff03);box-shadow:inset 0 1px #fff08}.item strong{display:block}.metric{display:flex;flex-direction:column;justify-content:space-between}.bar{height:5px;border-radius:99px;background:#0008;overflow:hidden;margin-top:8px;box-shadow:inset 0 1px #fff08}.bar i{display:block;height:100%;width:96%;border-radius:99px;background:linear-gradient(90deg,#64e6ee,#7f8dff);box-shadow:0 0 12px #67e5ee77}.orb{width:min(31vh,205px);height:min(31vh,205px);border-radius:50%;position:relative;margin-bottom:18px;background:radial-gradient(circle at 29% 23%,#fff 0 1.8%,#d7ffff 4%,#7ae9ed 10%,#38b8c6 23%,#335da4 43%,#171d3d 65%,#080c13 76%);box-shadow:inset 18px 12px 20px #fff5,inset -30px -36px 55px #000d,0 0 65px #55dce633,0 24px 50px #000b;transform:perspective(800px) rotateX(8deg) rotateY(-10deg)}.orb:before{content:"";position:absolute;inset:-17px;border:1px solid #74e9ed44;border-radius:50%;transform:rotateX(67deg) rotateZ(18deg);box-shadow:0 0 20px #5fdfe522}.orb:after{content:"";position:absolute;inset:-32px;border:1px solid #7d8dff2e;border-radius:50%;transform:rotateY(72deg) rotateZ(-25deg)}.hex{width:82px;height:82px;margin:auto;border-radius:22px;background:linear-gradient(145deg,#dfffff,#55dce7 32%,#556dff 75%,#28215a);box-shadow:inset 3px 3px 7px #fff9,inset -10px -12px 18px #15183f99,0 18px 40px #0009;display:grid;place-items:center;color:#071016;font-size:31px;font-weight:950;transform:perspective(500px) rotateX(8deg) rotateY(-8deg)}.big{font-size:42px;font-weight:900;letter-spacing:-.07em}.timeline{height:100%;display:grid;align-content:space-evenly}.event{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center}.event i{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 13px var(--green)}.event.active i{background:var(--cyan);box-shadow:0 0 15px var(--cyan)}.event.fail i{background:var(--red)}.code{padding:12px;border-radius:14px;background:#070b10;border:1px solid #ffffff12;color:#a9c0d0;font:11px/1.55 ui-monospace,SFMono-Regular,monospace}.center{height:100%;display:grid;place-items:center;text-align:center}.ring{width:min(25vh,170px);height:min(25vh,170px);border-radius:50%;display:grid;place-items:center;background:conic-gradient(from 210deg,#63e7ed,#7c91ff,#9d8cff,#63e7ed);box-shadow:0 0 55px #6de4ed24}.ring>div{width:82%;height:82%;border-radius:50%;display:grid;place-items:center;background:#0b1016;box-shadow:inset 0 0 35px #000,0 1px #fff1}.number{font-size:38px;font-weight:900}.mobile-nav{display:none}.menu-toggle{display:none}
.menu-overlay{position:fixed;z-index:80;inset:0;display:none;background:#0305079c;backdrop-filter:blur(18px)}.menu-overlay.open{display:block}.menu-panel{position:absolute;right:18px;top:18px;bottom:18px;width:min(390px,calc(100vw - 36px));padding:18px;border:1px solid #ffffff22;border-radius:30px;background:linear-gradient(145deg,#202a34f5,#0c1117f7);box-shadow:0 35px 100px #000d,inset 0 1px #fff18;transform:translateX(18px) scale(.98);animation:menuIn .22s ease forwards}@keyframes menuIn{to{transform:none}}.menu-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.menu-head strong{font-size:17px}.close{width:40px;height:40px;border-radius:13px;background:#ffffff09;border:1px solid #ffffff16;font-size:20px}.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.menu-grid button{min-height:74px;text-align:left;padding:13px;border-radius:18px;border:1px solid #ffffff12;background:linear-gradient(145deg,#ffffff0b,#ffffff03);box-shadow:inset 0 1px #fff0d;transition:.18s}.menu-grid button:hover{transform:translateY(-2px);border-color:#65e4ec44;background:linear-gradient(145deg,#65e4ec16,#ffffff04)}.menu-grid b{display:block;font-size:19px;margin-bottom:6px}.menu-grid span{font-size:10px;color:#8994a2}.menu-footer{position:absolute;left:18px;right:18px;bottom:18px;padding:12px 13px;border-radius:17px;border:1px solid #55e2a022;background:#55e2a008;color:#55e2a0;font-size:11px}
@media(max-width:820px){.app{display:block}.sidebar{display:none}.main{height:100dvh;padding:10px 11px 70px;grid-template-rows:55px minmax(0,1fr)}.title{font-size:21px}.ey{font-size:8px}.actions .btn{display:none}.menu-toggle{display:grid;place-items:center;width:43px;height:43px;border-radius:14px;background:linear-gradient(145deg,#ffffff12,#ffffff05);border:1px solid #ffffff1b;box-shadow:inset 1px 1px 3px #fff13,0 10px 25px #0008;font-size:21px}.viewport{height:100%}.g2,.g3{grid-template-columns:1fr}.stack{gap:10px}.grid{gap:10px}.card{padding:13px;border-radius:21px}.hero h2{font-size:21px}.hero p{font-size:12px;max-width:300px;margin-bottom:14px}.orb{width:min(27vh,145px);height:min(27vh,145px);margin-bottom:13px}.value{font-size:21px}.big{font-size:34px}.mobile-nav{position:fixed;z-index:60;display:grid;grid-template-columns:repeat(5,1fr);left:9px;right:9px;bottom:8px;height:55px;padding:4px;border:1px solid #ffffff1a;border-radius:19px;background:linear-gradient(145deg,#1a222bf2,#0b1016f5);backdrop-filter:blur(25px);box-shadow:0 18px 50px #000b,inset 0 1px #fff12}.mobile-nav button{background:transparent;color:#7d8895;font-size:8px;border-radius:14px}.mobile-nav button.active{color:#fff;background:linear-gradient(145deg,#ffffff0d,#ffffff03);box-shadow:inset 0 1px #fff10}.mobile-nav b{display:block;font-size:16px;margin-bottom:1px}.menu-panel{top:10px;right:10px;bottom:10px;width:calc(100vw - 20px);border-radius:26px}.menu-grid{gap:8px}.menu-grid button{min-height:69px}}
@media(max-width:390px){.card{padding:11px}.menu-grid button{min-height:64px}.menu-grid b{font-size:17px}.menu-grid span{font-size:9px}}
</style>

<body>
<div class="app"><aside class="sidebar"><div class="brand"><div class="logo">V</div>VEYTRIX</div><nav class="nav" id="sideNav"></nav><div class="side"><span class="status-dot"></span>CONTROL PLANE<div class="tiny muted" id="liveState">Synchronizing…</div></div></aside>
<main class="main"><header class="top"><div><div class="ey" id="ey">SPATIAL AUTONOMOUS ENGINEERING</div><div class="title" id="title">Command Center</div></div><div class="actions"><button class="btn" onclick="refreshData()">↻ Refresh</button><button class="btn primary" onclick="go('mission')">New Mission</button></div><button class="menu-toggle" onclick="toggleMenu(true)" aria-label="Open menu">☰</button></header><div class="viewport" id="screens"></div></main></div>
<nav class="mobile-nav" id="mobileNav"></nav>
<div class="menu-overlay" id="menuOverlay" onclick="if(event.target===this)toggleMenu(false)"><div class="menu-panel"><div class="menu-head"><div><div class="ey">VEYTRIX SYSTEM</div><strong>Navigation</strong></div><button class="close" onclick="toggleMenu(false)">×</button></div><div class="menu-grid" id="menuGrid"></div><div class="menu-footer">● Autonomous control plane connected · live repository surface</div></div></div>
<script>
const repo='fahadsoomro123/veytrix-autopilot';
const pages=[['home','⌂','Command'],['mission','＋','Mission'],['live','◉','Live'],['repos','⌁','Repository'],['verify','✓','Verify'],['history','≡','History'],['ai','✦','AI Engine'],['security','◈','Security'],['settings','⚙','Settings'],['about','i','About']];
const meta={home:['Command Center','SPATIAL AUTONOMOUS ENGINEERING'],mission:['New Mission','INTENT → EXECUTION → VERIFICATION'],live:['Live Autopilot','EXECUTION STATE'],repos:['Repositories','GITHUB ENGINEERING SURFACE'],verify:['Verification','EVIDENCE BEFORE DELIVERY'],history:['Mission History','AUDITABLE RUNS'],ai:['AI Engine','DETERMINISTIC FIRST · ESCALATE WHEN REQUIRED'],security:['Security','TRUST BOUNDARY'],settings:['Settings','CONTROL PLANE'],about:['About','VEYTRIX SYSTEM']};
let state={run:'—',sha:'—',updated:'syncing',conclusion:'—'};
const card=(x,c='')=>`<section class="card ${c}">${x}</section>`;
function nav(){sideNav.innerHTML=pages.map(p=>`<button data-p="${p[0]}"><b>${p[1]}</b><span>${p[2]}</span></button>`).join('');mobileNav.innerHTML=pages.slice(0,5).map(p=>`<button data-p="${p[0]}"><b>${p[1]}</b>${p[2]}</button>`).join('');menuGrid.innerHTML=pages.map(p=>`<button data-p="${p[0]}"><b>${p[1]}</b><strong>${p[2]}</strong><span>${meta[p[0]][0]}</span></button>`).join('');document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>go(b.dataset.p))}
function render(){const h=state.run,s=state.sha.slice(0,8);screens.innerHTML=`
<section class="screen" id="p-home"><div class="grid g2"><div>${card(`<div class="hero"><div class="orb"></div><div class="label">VEYTRIX AUTOPILOT</div><h2>Autonomy with physical depth.</h2><p>A flagship spatial interface built around layered materials, cinematic lighting and controlled motion.</p><button class="btn primary" onclick="go('live')">Enter live control</button></div>`)}</div><div class="stack">${card(`<div class="row"><div><div class="label">LIVE REPOSITORY</div><div class="value">VEYTRIX</div></div><span class="pill green">CONNECTED</span></div><div class="list"><div class="item"><span class="muted">HEAD</span><strong>${s}</strong></div><div class="item"><span class="muted">LATEST ACTION</span><strong>#${h}</strong></div><div class="item"><span class="muted">CONCLUSION</span><strong>${state.conclusion}</strong></div></div>`,'metric')}${card(`<div class="label">SYSTEM PRESENCE</div><div class="value" style="margin-top:5px">ONLINE</div><div class="bar"><i></i></div><div class="tiny muted" style="margin-top:8px">${state.updated}</div>`,'metric')}</div></div></section>
<section class="screen" id="p-live"><div class="grid g2"><div>${card(`<div class="center"><div><div class="ring"><div><div class="number">#${h}</div><div class="tiny muted">LATEST RUN</div></div></div><div style="margin-top:15px"><span class="pill green">${state.conclusion}</span></div></div></div>`)}</div>${card(`<div class="label">EXECUTION FLOW</div><div class="timeline"><div class="event"><i></i><div><strong>Source checkout</strong><div class="tiny muted">repository revision loaded</div></div><span class="pill green">PASS</span></div><div class="event"><i></i><div><strong>Contract gate</strong><div class="tiny muted">identity and policy</div></div><span class="pill green">PASS</span></div><div class="event active"><i></i><div><strong>Verification</strong><div class="tiny muted">evidence chain</div></div><span class="pill green">LIVE</span></div><div class="event"><i></i><div><strong>Delivery</strong><div class="tiny muted">human-approved release</div></div><span class="pill">READY</span></div></div>`)}</div></section>
<section class="screen" id="p-mission"><div class="grid g2">${card(`<div class="label">MISSION BRIEF</div><h2 style="font-size:25px;margin:6px 0 14px">Build & verify VEYTRIX Android</h2><div class="list"><div class="item"><strong>Target identity</strong><span class="tiny muted">com.veytrix.autopilot</span></div><div class="item"><strong>Visual contract</strong><span class="tiny muted">hyper-realistic spatial preview</span></div><div class="item"><strong>Release policy</strong><span class="tiny muted">debug → human test → signed release</span></div></div><button class="btn primary wide" onclick="go('live')" style="margin-top:12px">Start controlled run</button>`)}</div>${card(`<div class="label">GUARDRAILS</div><div class="list"><div class="item"><strong>Viewport</strong><span class="pill green">NO SCROLL</span></div><div class="item"><strong>Secrets</strong><span class="pill green">ISOLATED</span></div><div class="item"><strong>Identity</strong><span class="pill green">LOCKED</span></div><div class="item"><strong>Release</strong><span class="pill amber">HUMAN GATE</span></div></div>`)}</div></section>
<section class="screen" id="p-repos"><div class="grid g3">${card(`<div class="label">REPOSITORY</div><h2 style="font-size:20px">veytrix-autopilot</h2><span class="pill green">LIVE GITHUB</span><div class="list"><div class="item"><strong>Owner</strong><span class="tiny muted">fahadsoomro123</span></div><div class="item"><strong>Surface</strong><span class="tiny muted">Android + control plane</span></div></div>`)}</div>${card(`<div class="label">HEAD REVISION</div><div class="big" style="margin-top:8px">${s}</div><div class="tiny muted">Current preview branch revision</div>`)}</div>${card(`<div class="label">LATEST RUN</div><div class="big">#${h}</div><span class="pill green">${state.conclusion}</span><div class="bar"><i></i></div>`)}</div></section>
<section class="screen" id="p-verify"><div class="grid g2">${card(`<div class="center"><div><div class="hex">✓</div><h2>Evidence verified</h2><p class="muted">Deterministic checks remain the first line of trust.</p><span class="pill green">PASS</span></div></div>`)}</div>${card(`<div class="label">VERIFICATION CHAIN</div><div class="list"><div class="item"><strong>Preview structure</strong><span class="pill green">PASS</span></div><div class="item"><strong>Android identity</strong><span class="pill green">PASS</span></div><div class="item"><strong>Artifact integrity</strong><span class="pill green">PASS</span></div><div class="code">sha256 · evidence retained<br>release signing · secrets only</div></div>`)}</div></section>
<section class="screen" id="p-history"><div class="grid g2">${card(`<div class="label">AUDIT TRAIL</div><div class="list"><div class="item"><strong>Run #${h}</strong><span class="tiny muted">${state.updated}</span></div><div class="item"><strong>Preview redesign</strong><span class="tiny muted">hyper-realistic spatial UI</span></div><div class="item"><strong>Android contract</strong><span class="tiny muted">verified</span></div></div>`)}</div>${card(`<div class="label">MISSION TIMELINE</div><div class="timeline"><div class="event"><i></i><div><strong>Design surface</strong><div class="tiny muted">material system loaded</div></div><span class="pill green">DONE</span></div><div class="event"><i></i><div><strong>Interaction layer</strong><div class="tiny muted">navigation wired</div></div><span class="pill green">DONE</span></div><div class="event active"><i></i><div><strong>Human review</strong><div class="tiny muted">awaiting approval</div></div><span class="pill amber">NOW</span></div></div>`)}</div></section>
<section class="screen" id="p-ai"><div class="grid g2">${card(`<div class="center"><div><div class="hex">✦</div><h2>AI repair engine</h2><p class="muted">Classify → fingerprint → repair → verify.</p></div></div>`)}</div>${card(`<div class="label">DECISION PIPELINE</div><div class="list"><div class="item"><strong>Deterministic diagnosis</strong><span class="pill green">FIRST</span></div><div class="item"><strong>Stable failure fingerprint</strong><span class="pill green">ENABLED</span></div><div class="item"><strong>Bounded AI escalation</strong><span class="pill">CONTROLLED</span></div><div class="item"><strong>Publish only after verification</strong><span class="pill green">LOCKED</span></div></div>`)}</div></section>
<section class="screen" id="p-security"><div class="grid g3">${card(`<div class="label">TRUST</div><div class="big">01</div><strong>Secrets stay outside source</strong>`)}</div>${card(`<div class="label">CONTROL</div><div class="big">02</div><strong>Failed revisions are isolated</strong>`)}</div>${card(`<div class="label">DELIVERY</div><div class="big">03</div><strong>Human approval remains explicit</strong>`)}</div></section>
<section class="screen" id="p-settings"><div class="grid g2">${card(`<div class="label">CONTROL PLANE</div><div class="list"><div class="item"><strong>Autopilot recovery</strong><span class="pill green">ON</span></div><div class="item"><strong>Deterministic verification</strong><span class="pill green">ON</span></div><div class="item"><strong>Release gate</strong><span class="pill amber">HUMAN</span></div></div>`)}</div>${card(`<div class="label">VISUAL SYSTEM</div><div class="list"><div class="item"><strong>Spatial depth</strong><span class="pill green">ACTIVE</span></div><div class="item"><strong>Material lighting</strong><span class="pill green">ACTIVE</span></div><div class="item"><strong>Viewport lock</strong><span class="pill green">ACTIVE</span></div></div>`)}</div></section>
<section class="screen" id="p-about"><div class="grid g2">${card(`<div class="center"><div><div class="logo" style="margin:auto;width:76px;height:76px;border-radius:24px;font-size:30px">V</div><h2>VEYTRIX</h2><p class="muted">A spatial autonomous engineering control surface.</p></div></div>`)}</div>${card(`<div class="label">DESIGN LANGUAGE</div><div class="list"><div class="item"><strong>Material</strong><span class="tiny muted">titanium glass · sapphire light</span></div><div class="item"><strong>Depth</strong><span class="tiny muted">layered elevation · soft shadows</span></div><div class="item"><strong>Interaction</strong><span class="tiny muted">tactile controls · spatial menu</span></div></div>`)}</div></section>`;activate(current)}
let current='home';function go(p){current=p;const m=meta[p]||meta.home;title.textContent=m[0];ey.textContent=m[1];document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id==='p-'+p));document.querySelectorAll('[data-p]').forEach(x=>x.classList.toggle('active',x.dataset.p===p));toggleMenu(false)}function activate(p){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id==='p-'+p));document.querySelectorAll('[data-p]').forEach(x=>x.classList.toggle('active',x.dataset.p===p))}
function toggleMenu(open){menuOverlay.classList.toggle('open',open)}
async function refreshData(){try{const r=await fetch(`https://api.github.com/repos/${repo}/actions/runs?per_page=1`,{headers:{Accept:'application/vnd.github+json'}});if(!r.ok)throw Error(r.status);const d=await r.json(),x=d.workflow_runs?.[0];if(x){state.run=x.run_number;state.sha=x.head_sha||'—';state.conclusion=(x.conclusion||x.status||'RUNNING').toUpperCase();state.updated=new Date(x.updated_at).toLocaleString()}liveState.textContent=`GitHub synced · ${state.updated}`;render()}catch(e){liveState.textContent='Preview mode · live sync unavailable';render()}}
nav();render();go('home');refreshData();
</script>
