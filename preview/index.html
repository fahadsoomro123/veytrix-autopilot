<body><div class="app"><aside class="sidebar"><div class="brand"><div class="mark">V</div><b>VEYTRIX</b></div><nav class="nav" id="nav"></nav><div class="side-status"><span class="dot"></span>All systems nominal<div class="small" style="margin-top:5px">Autonomy core · v0.9 preview</div></div></aside><main class="main"><div class="top"><div><div class="eyebrow" id="eyebrow">Autonomous engineering control</div><h1 id="title">Command Center</h1></div><div class="top-actions"><button class="ghost" onclick="toast('Command palette is available in the preview')">⌘K</button><button class="primary" onclick="go('new')">New mission</button></div></div><div id="screens"></div></main></div><nav class="mobile-nav" id="mobileNav"></nav><div class="toast" id="toast"></div>

const screens={

S.live=()=>screen('live',`<div class="grid g2"><div class="card"><div class="row"><div><div class="eyebrow">VX-1042</div><h2 style="margin:4px 0">Release candidate</h2></div><span id="runState" class="pill violet">RUNNING</span></div><div class="engine" style="width:145px;height:145px;margin:18px auto"><div class="core" style="inset:42px"></div></div><div class="steps" id="runSteps"></div></div>${card(`<div class="row"><b>Mission telemetry</b><span class="pill green">LIVE</span></div><div class="list"><div class="item"><span>Elapsed</span><b id="elapsed">03:18</b></div><div class="item"><span>Actions</span><b>27</b></div><div class="item"><span>Repairs</span><b>1</b></div><div class="item"><span>Verification</span><b>9 / 9</b></div></div><button class="ghost" style="width:100%;margin-top:14px" onclick="go('timeline')">Open execution timeline</button>`)}${card(`<div class="row"><b>Current reasoning</b><span class="pill violet">ROUTER</span></div><p class="small">Build completed. Verification is checking artifact integrity and reproducibility before the delivery gate.</p><div class="code">[14:32:08] verify → checksum<br>[14:32:09] verify → manifest<br>[14:32:10] verify → provenance<br>[14:32:11] delivery gate → waiting</div>`)}</div>`);
S.timeline=()=>screen('timeline',card(`<div class="row"><div><div class="eyebrow">Trace</div><h2>Autonomous execution</h2></div><span class="pill green">9 stages</span></div><div class="timeline" style="margin-top:22px"><div class="event done"><b>INTENT</b><div class="small">Instruction normalized into a bounded mission.</div></div><div class="event done"><b>PLAN</b><div class="small">7 actions, 3 verification gates.</div></div><div class="event done"><b>IMPLEMENT</b><div class="small">Changes applied to isolated workspace.</div></div><div class="event done"><b>BUILD</b><div class="small">Release candidate produced.</div></div><div class="event done"><b>TEST</b><div class="small">One flaky test detected.</div></div><div class="event done"><b>REPAIR</b><div class="small">Failure isolated and repaired.</div></div><div class="event done"><b>VERIFY</b><div class="small">Evidence chain complete.</div></div><div class="event done"><b>ARTIFACT</b><div class="small">release.apk · 48.2 MB</div></div><div class="event"><b>DELIVER</b><div class="small">Awaiting explicit delivery action.</div></div></div>`));
S.failure=()=>screen('failure',`<div class="grid g2">${card(`<span class="pill amber">RECOVERED</span><h2>Test failure isolated</h2><p class="small">The checkout integration test failed because a fixture expected a stale API response shape. VEYTRIX contained the change to the fixture layer.</p><div class="code">FAIL  CheckoutFlowTest<br>expected: {status:"ok"}<br>received: {state:"ok"}<br><br>repair → fixture/schema adapter<br>result → 18 / 18 tests passing</div>`)}${card(`<div class="eyebrow">Recovery policy</div><h3>Why this repair was allowed</h3><div class="list"><div class="item"><span>Scope</span><b>1 fixture</b></div><div class="item"><span>Risk</span><span class="pill green">LOW</span></div><div class="item"><span>Rollback</span><b>Available</b></div></div><button class="ghost" style="width:100%;margin-top:14px" onclick="go('mission')">View mission evidence</button>`)}</div>`);

S.artifact=()=>screen('artifact',`<div class="grid g2">${card(`<div class="artifact" style="align-items:flex-start"><div class="artifact-visual" style="width:112px;height:144px"><b>APK</b></div><div><span class="pill green">VERIFIED</span><h2>veytrix-release.apk</h2><div class="small">Release candidate · v0.9.0</div><div class="list"><div class="item"><span>Size</span><b>48.2 MB</b></div><div class="item"><span>Checksum</span><b>8f4c…a91d</b></div><div class="item"><span>Built</span><b>14:32 UTC</b></div></div></div></div>`)}${card(`<div class="eyebrow">Integrity</div><h3>Evidence chain</h3><div class="steps"><div class="step done"><div class="n">✓</div><div><strong>Manifest</strong><div class="small">matches build plan</div></div></div><div class="step done"><div class="n">✓</div><div><strong>Checksum</strong><div class="small">stable</div></div></div><div class="step done"><div class="n">✓</div><div><strong>Provenance</strong><div class="small">recorded</div></div></div></div><button class="primary" style="width:100%;margin-top:14px" onclick="toast('Mock delivery gate opened')">Open delivery gate</button>`)}</div>`);
S.verify=()=>screen('verify',card(`<div class="row"><div><div class="eyebrow">Pre-delivery evidence</div><h2>Verification complete</h2></div><span class="pill green">9 / 9 PASSED</span></div><div class="grid g3" style="margin-top:18px">${['Build reproducibility','Unit tests','Static analysis','Dependency audit','Artifact manifest','Checksum','Provenance','Permissions','Delivery policy'].map((x,i)=>card(`<span class="pill green">PASS</span><h3 style="margin:10px 0 4px">${x}</h3><div class="small">Evidence record #${1042+i}</div>`)).join('')}</div>`));
S.history=()=>screen('history',card(`<div class="row"><div><div class="eyebrow">Auditable runs</div><h2>Mission history</h2></div><span class="pill">27 runs</span></div><div class="list" style="margin-top:18px">${[['VX-1042','Release candidate','VERIFIED','3m 18s','2 min ago'],['VX-1041','Repair flaky tests','REPAIRED','8m 42s','1h ago'],['VX-1040','Dependency audit','VERIFIED','1m 09s','3h ago'],['VX-1039','Build debug','FAILED','5m 31s','Yesterday']].map((r,i)=>`<div class="item" onclick="${i===0?'go(\'mission\')':''}"><div><strong>${r[0]} · ${r[1]}</strong><div class="small">${r[4]} · ${r[3]}</div></div><span class="pill ${r[2]==='VERIFIED'?'green':r[2]==='FAILED'?'amber':'violet'}">${r[2]}</span></div>`).join('')}</div>`));
S.mission=()=>screen('mission',`<div class="grid g2">${card(`<div class="row"><div><span class="pill green">VERIFIED</span><h2>VX-1042</h2><div class="small">Release candidate · veytrix-engine · main</div></div><b>3m 18s</b></div><p>Prepare the release candidate, run verification, repair failures automatically, and produce a signed-ready artifact.</p><div class="steps"><div class="step done"><div class="n">✓</div><div><strong>Plan</strong><div class="small">7 bounded actions</div></div></div><div class="step done"><div class="n">✓</div><div><strong>Repair</strong><div class="small">1 contained change</div></div></div><div class="step done"><div class="n">✓</div><div><strong>Verify</strong><div class="small">9 / 9 checks</div></div></div></div>`)}${card(`<div class="eyebrow">Evidence</div><div class="list"><div class="item"><span>Artifact</span><b>release.apk</b></div><div class="item"><span>Checksum</span><b>8f4c…a91d</b></div><div class="item"><span>Repository</span><b>9b7c2d1</b></div><div class="item"><span>AI escalations</span><b>2</b></div></div><button class="ghost" style="width:100%;margin-top:14px" onclick="go('timeline')">Open full trace</button>`)}</div>`);
S.ai=()=>screen('ai',`<div class="grid g2">${card(`<div class="row"><div><div class="eyebrow">Autonomous subsystem</div><h2>AI Engine</h2></div><span class="pill green">HEALTHY</span></div><div class="engine" style="width:150px;height:150px;margin:22px auto"><div class="core" style="inset:43px"></div></div><div class="hero-copy"><p>Not a chatbot. A bounded reasoning layer that escalates only when deterministic engineering tools cannot finish the task.</p></div>`)}${card(`<h3>Routing policy</h3><div class="steps"><div class="step done"><div class="n">1</div><div><strong>Deterministic</strong><div class="small">tools · checks · tests</div></div><span class="pill green">ACTIVE</span></div><div class="step active"><div class="n">2</div><div><strong>Reasoning</strong><div class="small">plan · diagnose · repair</div></div><span class="pill violet">2 CALLS</span></div><div class="step"><div class="n">3</div><div><strong>Fallback</strong><div class="small">isolated provider</div></div><span class="pill">STANDBY</span></div></div><div class="row" style="margin-top:18px"><span class="small">Current confidence</span><b>94%</b></div><div class="bar" style="margin-top:8px"><i style="width:94%"></i></div>`)}</div>`);
S.settings=()=>screen('settings',`<div class="grid g2">${card(`<h3>Experience</h3><div class="list"><div class="item"><div><strong>Motion</strong><div class="small">State-driven transitions</div></div><div class="switch on"><i></i></div></div><div class="item"><div><strong>Haptics</strong><div class="small">Tactile state feedback</div></div><div class="switch on"><i></i></div></div><div class="item"><div><strong>Compact density</strong><div class="small">More information per screen</div></div><div class="switch"><i></i></div></div></div>`)}${card(`<h3>Execution</h3><div class="list"><div class="item"><span>Default timeout</span><b>20 min</b></div><div class="item"><span>Repair budget</span><b>3 cycles</b></div><div class="item"><span>Verification</span><span class="pill green">STRICT</span></div></div>`)}${card(`<h3>Appearance</h3><div class="list"><div class="item"><span>Theme</span><b>Obsidian</b></div><div class="item"><span>Accent</span><b>Electric violet</b></div><div class="item"><span>Reduce motion</span><span class="pill">OFF</span></div></div>`)}</div>`);
S.security=()=>screen('security',`<div class="grid g2">${card(`<div class="row"><div><div class="eyebrow">Trust boundary</div><h2>Security health</h2></div><span class="pill green">98 / 100</span></div><div class="list"><div class="item"><span>Credential storage</span><b>Encrypted</b></div><div class="item"><span>Repository token</span><b>••••••91</b></div><div class="item"><span>Provider secrets</span><b>Redacted</b></div><div class="item"><span>Workspace isolation</span><b>Enabled</b></div></div>`)}${card(`<h3>Connections</h3><div class="list"><div class="item"><span>GitHub</span><span class="pill green">CONNECTED</span></div><div class="item"><span>AI Router</span><span class="pill green">CONNECTED</span></div><div class="item"><span>Signing service</span><span class="pill amber">NOT CONFIGURED</span></div></div><button class="ghost" style="width:100%;margin-top:14px" onclick="toast('Mock credential manager opened')">Manage credentials</button>`)}</div>`);
S.about=()=>screen('about',`<div class="card"><div class="eyebrow">Preview only</div><h2>VEYTRIX Autonomous Engineering Control</h2><p class="small">Flagship multi-screen design research prototype. Local mock data only. No GitHub actions, AI providers, production Android code, APK build, or backend integrations are connected.</p><div class="grid g3" style="margin-top:18px">${[['17','screens'],['390×844','primary target'],['320px','minimum validation']].map(x=>`<div class="metric card"><div class="label">${x[1]}</div><div class="value">${x[0]}</div></div>`).join('')}</div></div>`);
for(const [id,fn] of Object.entries(S)) document.getElementById('screens').insertAdjacentHTML('beforeend',fn());
function go(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById('s-'+id).classList.add('active');document.getElementById('title').textContent=screens[id].title;document.getElementById('eyebrow').textContent=screens[id].ey;document.querySelectorAll('[data-go]').forEach(b=>b.classList.toggle('active',b.dataset.go===id));scrollTo({top:0,behavior:'smooth'})}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(b.dataset.go)});
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),2200)}
function startMission(){toast('Mock mission started — opening live autopilot');go('live');const steps=['Intent','Plan','Implement','Build','Test','Repair','Verify','Artifact','Deliver'];document.getElementById('runSteps').innerHTML=steps.map((x,i)=>`<div class="step ${i<7?'done':i===7?'active':''}"><div class="n">${i<7?'✓':i+1}</div><div><strong>${x}</strong><div class="small">${i<7?'completed':i===7?'active':'waiting'}</div></div><span class="pill ${i<7?'green':i===7?'violet':''}">${i<7?'DONE':i===7?'ACTIVE':'WAIT'}</span></div>`).join('')}
go('command');
</script></body></html>
