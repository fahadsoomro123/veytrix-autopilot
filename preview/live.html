Object.keys(P).forEach(k=>{const s=document.createElement('section');s.className='screen';s.id='s-'+k;s.innerHTML=body[k]||`<div class="head"><div><div class="ey">${P[k][1]}</div><div class="h1">${P[k][0]}</div><div class="sub">${P[k][2]}</div></div></div>`;screens.appendChild(s)});
function go(k){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));const el=document.getElementById('s-'+k);if(el)el.classList.add('on');document.querySelectorAll('[data-go]').forEach(b=>b.classList.toggle('active',b.dataset.go===k));document.querySelectorAll('#mobileNav [data-go]').forEach(b=>b.classList.toggle('on',b.dataset.go===k));document.getElementById('ttl').textContent=P[k][0];document.getElementById('crumb').textContent='VEYTRIX / '+P[k][0].toUpperCase();drawer.classList.remove('open');location.hash=k}
document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));document.getElementById('hamb').onclick=()=>drawer.classList.add('open');document.getElementById('close').onclick=()=>drawer.classList.remove('open');drawer.onclick=e=>{if(e.target===drawer)drawer.classList.remove('open')};go(P[location.hash.slice(1)]?location.hash.slice(1):'command');
</script></body></html>
