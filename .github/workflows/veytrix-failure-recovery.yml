name: Veytrix Permanent Failure Recovery

on:
  workflow_run:
    workflows:
      - Build Veytrix Autopilot Android
      - Veytrix AI Escalation Smoke
      - Veytrix Decision Engine Gate
      - Veytrix Free Gemini AI Gate
      - Veytrix Smart Autopilot Self-Test
    types: [completed]

permissions:
  contents: write
  actions: write

concurrency:
  group: veytrix-failure-recovery-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

env:
  MAX_FREE_RERUNS: '2'

jobs:
  recover:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      FAILED_WORKFLOW: ${{ github.event.workflow_run.name }}
    steps:
      - name: Checkout failed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0

      - name: Collect and classify failure
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          gh run view "$RUN_ID" -R "$GITHUB_REPOSITORY" --log-failed > /tmp/veytrix-failure.log || true
          echo "=== VEYTRIX FAILURE EVIDENCE ==="
          cat /tmp/veytrix-failure.log
          if grep -Eqi '(rate limit|timed out|timeout|HTTP 503|HTTP 502|HTTP 504|connection reset|connection refused|temporary failure|network is unreachable|failed to download|could not resolve host|runner.*unavailable|service unavailable|no space left on device)' /tmp/veytrix-failure.log; then
            echo "classification=transient" >> "$GITHUB_OUTPUT"
          elif grep -Eqi '(compilation failed|compile.*error|test failed|assertion.*failed|syntax error|type error|lint.*error|module not found|cannot find symbol|execution failed)' /tmp/veytrix-failure.log; then
            echo "classification=code-or-build" >> "$GITHUB_OUTPUT"
          else
            echo "classification=unknown" >> "$GITHUB_OUTPUT"
          fi

      - name: Rerun bounded transient failure
        if: steps.classify.outputs.classification == 'transient'
        shell: bash
        run: |
          set -euo pipefail
          attempt="$(gh run view "$RUN_ID" -R "$GITHUB_REPOSITORY" --json runAttempt --jq '.runAttempt')"
          if (( attempt >= MAX_FREE_RERUNS )); then
            echo "Transient failure detected but rerun ceiling reached for run $RUN_ID."
            exit 1
          fi
          echo "Transient failure detected; rerunning failed jobs (attempt $((attempt + 1)))."
          gh run rerun "$RUN_ID" -R "$GITHUB_REPOSITORY" --failed

      - name: Create permanent repair handoff for non-transient failures
        if: steps.classify.outputs.classification != 'transient'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .veytrix
          cat > .veytrix/autopilot-failure.md <<EOF
          # Veytrix Autopilot Failure Handoff

          - Failed workflow: ${FAILED_WORKFLOW}
          - Run ID: ${RUN_ID}
          - Failed revision: ${HEAD_SHA}
          - Branch: ${HEAD_BRANCH}
          - Classification: ${{ steps.classify.outputs.classification }}

          The permanent controller collected the failed-job logs above. This handoff is intentionally deterministic: non-transient failures are not blindly rerun.
          EOF
          echo "Non-transient failure requires repair/diagnosis before another run." 
          exit 1
