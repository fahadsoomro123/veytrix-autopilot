name: Build Veytrix Autopilot Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :autopilot:assembleDebug

      - name: Verify APK artifact
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          apk='autopilot/build/outputs/apk/debug/autopilot-debug.apk'
          test -s "$apk"
          sha256sum "$apk" | tee autopilot-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Veytrix-Autopilot-debug
          path: |
            android/autopilot/build/outputs/apk/debug/autopilot-debug.apk
            android/autopilot-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
