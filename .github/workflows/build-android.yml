name: Build Veytrix Autopilot Android

on:
  push:
    paths:
      - 'android/**'
      - 'scripts/**'
      - 'docs/ANDROID-RELEASE.md'
      - 'scripts/verify_veytrix_control_plane_contract.sh'
      - 'scripts/verify_veytrix_android_security_contract.sh'
      - 'scripts/verify_veytrix_phase2_home_contract.sh'
      - 'scripts/verify_veytrix_phase2_primary_contract.sh'
      - 'scripts/verify_veytrix_mesh_contract.sh'
      - 'free-ai-mesh/**'
      - 'scripts/verify_veytrix_phase3_secondary_contract.sh'
      - '.github/workflows/build-android.yml'
      - '.github/workflows/veytrix-autopilot.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'scripts/**'
      - 'docs/ANDROID-RELEASE.md'
      - 'scripts/verify_veytrix_control_plane_contract.sh'
      - 'scripts/verify_veytrix_android_security_contract.sh'
      - 'scripts/verify_veytrix_phase3_secondary_contract.sh'
      - '.github/workflows/build-android.yml'
      - '.github/workflows/veytrix-autopilot.yml'

  workflow_dispatch:
    inputs:
      signed_release:
        description: 'Build and verify the signed release APK'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-android:
    name: Debug build and verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify VEYTRIX control-plane security contract
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify_veytrix_control_plane_contract.sh .

      - name: Verify VEYTRIX native Android contract
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify_veytrix_android_contract.sh .

      - name: Verify VEYTRIX Android security contract
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify_veytrix_android_security_contract.sh .

      - name: Verify VEYTRIX Phase 2 Home contract
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify_veytrix_phase2_home_contract.sh .

      - name: Verify VEYTRIX Phase 2 primary screen contract
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify_veytrix_phase2_primary_contract.sh .

      - name: Verify VEYTRIX Phase 3 secondary surface contract
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify_veytrix_phase3_secondary_contract.sh .

      - name: Verify VEYTRIX 3M GitHub Mesh contract
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify_veytrix_mesh_contract.sh .

      - name: Run Free AI Mesh integration canary
        shell: bash
        run: |
          set -euo pipefail
          node free-ai-mesh/veytrix_ai_router_canary.mjs

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Run Gradle checks
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :autopilot:check

      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :autopilot:assembleDebug
          test -s autopilot/build/outputs/apk/debug/autopilot-debug.apk
          sha256sum autopilot/build/outputs/apk/debug/autopilot-debug.apk | tee autopilot/build/outputs/apk/debug/autopilot-debug.apk.sha256

      - name: Verify debug APK identity
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          apk='autopilot/build/outputs/apk/debug/autopilot-debug.apk'
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          test -x "$AAPT"
          "$AAPT" dump badging "$apk" > /tmp/veytrix-debug-badging.txt
          grep -F "package: name='com.veytrix.autopilot' versionCode='10001' versionName='1.0.1'" /tmp/veytrix-debug-badging.txt
          grep -F "launchable-activity: name='com.veytrix.autopilot.MainActivity'" /tmp/veytrix-debug-badging.txt
          if unzip -l "$apk" | grep -F 'assets/veytrix_preview.html'; then
            echo 'Legacy WebView preview asset is still packaged.' >&2
            exit 1
          fi

      - name: Upload debug APK for phone testing
        uses: actions/upload-artifact@v7
        with:
          name: Veytrix-Autopilot-debug-phone-test
          path: |
            android/autopilot/build/outputs/apk/debug/autopilot-debug.apk
            android/autopilot/build/outputs/apk/debug/autopilot-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Record normal build result
        shell: bash
        run: |
          {
            echo '### Veytrix Android Debug Build'
            echo '- Native Android implementation: verified'
            echo '- Android contract: passed'
            echo '- Legacy WebView preview: not packaged'
            echo '- Gradle checks: passed'
            echo '- Debug APK: built and identity-verified (1.0.1 / 10001)'
            echo '- Phone-test artifact: uploaded'
            if [[ '${{ inputs.signed_release }}' == 'true' ]]; then
              echo '- Signed release request: queued for release job'
            else
              echo '- Signed release: not requested (normal push path)'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Signed release APK
    if: github.event_name == 'workflow_dispatch' && inputs.signed_release == true
    needs: build-android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify release signing inputs
        env:
          VEYTRIX_KEYSTORE_BASE64: ${{ secrets.VEYTRIX_KEYSTORE_BASE64 }}
          VEYTRIX_KEYSTORE_PASSWORD: ${{ secrets.VEYTRIX_KEYSTORE_PASSWORD }}
          VEYTRIX_KEY_ALIAS: ${{ secrets.VEYTRIX_KEY_ALIAS }}
          VEYTRIX_KEY_PASSWORD: ${{ secrets.VEYTRIX_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${VEYTRIX_KEYSTORE_BASE64:-}" ]] || missing+=(VEYTRIX_KEYSTORE_BASE64)
          [[ -n "${VEYTRIX_KEYSTORE_PASSWORD:-}" ]] || missing+=(VEYTRIX_KEYSTORE_PASSWORD)
          [[ -n "${VEYTRIX_KEY_ALIAS:-}" ]] || missing+=(VEYTRIX_KEY_ALIAS)
          [[ -n "${VEYTRIX_KEY_PASSWORD:-}" ]] || missing+=(VEYTRIX_KEY_PASSWORD)
          if ((${#missing[@]})); then
            printf '::error title=Release signing blocker::Missing repository Actions secrets: %s\n' "${missing[*]}"
            echo "VEYTRIX_RELEASE_SIGNING_BLOCKED: ${missing[*]}" >&2
            exit 1
          fi
          echo 'All four release signing inputs are configured.'

      - name: Verify VEYTRIX native Android contract
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify_veytrix_android_contract.sh .

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Build signed release APK
        working-directory: android
        env:
          VEYTRIX_KEYSTORE_BASE64: ${{ secrets.VEYTRIX_KEYSTORE_BASE64 }}
          VEYTRIX_KEYSTORE_PASSWORD: ${{ secrets.VEYTRIX_KEYSTORE_PASSWORD }}
          VEYTRIX_KEY_ALIAS: ${{ secrets.VEYTRIX_KEY_ALIAS }}
          VEYTRIX_KEY_PASSWORD: ${{ secrets.VEYTRIX_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :autopilot:assembleRelease

      - name: Verify release APK identity and integrity
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          apk='autopilot/build/outputs/apk/release/autopilot-release.apk'
          test -s "$apk"
          sha256sum "$apk" | tee autopilot/build/outputs/apk/release/autopilot-release.apk.sha256
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          test -x "$AAPT"
          "$AAPT" dump badging "$apk" > /tmp/veytrix-release-badging.txt
          grep -F "package: name='com.veytrix.autopilot' versionCode='10001' versionName='1.0.1'" /tmp/veytrix-release-badging.txt
          grep -F "launchable-activity: name='com.veytrix.autopilot.MainActivity'" /tmp/veytrix-release-badging.txt
          if unzip -l "$apk" | grep -F 'assets/veytrix_preview.html'; then
            echo 'Legacy WebView preview asset is still packaged.' >&2
            exit 1
          fi

      - name: Upload signed release APK
        uses: actions/upload-artifact@v7
        with:
          name: Veytrix-Autopilot-APK
          path: |
            android/autopilot/build/outputs/apk/release/autopilot-release.apk
            android/autopilot/build/outputs/apk/release/autopilot-release.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Record signed release result
        shell: bash
        run: |
          {
            echo '### Veytrix Signed Release'
            echo '- Signing inputs: configured'
            echo '- Release APK: built'
            echo '- Version: 1.0.1 (10001)'
            echo '- Package identity: verified'
            echo '- Native Android implementation: verified'
            echo '- Legacy WebView preview: not packaged'
            echo '- Release artifact: uploaded'
          } >> "$GITHUB_STEP_SUMMARY"
