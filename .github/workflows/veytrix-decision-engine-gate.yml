name: Veytrix Decision Engine Gate

on:
  push:
    branches:
      - migration/forensic-smart-autopilot
    paths:
      - 'scripts/decide_engine.sh'
      - 'scripts/test_decide_engine.sh'
      - '.github/workflows/veytrix-autopilot.yml'
      - '.github/workflows/veytrix-decision-engine-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decision-engine-self-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Run deterministic-first decision tests
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/test_decide_engine.sh

      - name: Validate YAML structure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in [
              Path('.github/workflows/veytrix-autopilot.yml'),
              Path('.github/workflows/veytrix-decision-engine-gate.yml'),
          ]:
              data = yaml.safe_load(path.read_text())
              if not isinstance(data, dict):
                  raise SystemExit(f'{path}: workflow root is not a mapping')
              if 'jobs' not in data or not isinstance(data['jobs'], dict):
                  raise SystemExit(f'{path}: missing jobs mapping')
              print(f'validated={path}')
          PY

      - name: Record gate evidence
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Veytrix Smart Autopilot — Decision Gate'
            echo ''
            echo '| Case | Expected |'
            echo '|---|---|'
            echo '| deterministic verification sufficient | github-free; AI not selected |'
            echo '| deterministic verification passes but mission requires reasoning | ai |'
            echo '| deterministic verification insufficient | ai |'
            echo '| AI unavailable | deterministic-only fallback |'
            echo '| explicit AI without key | hard failure |'
            echo ''
            echo 'Decision self-test and YAML structure validation passed without invoking OpenAI.'
            echo 'API-key presence alone is not the engine-selection criterion.'
          } >> "$GITHUB_STEP_SUMMARY"
