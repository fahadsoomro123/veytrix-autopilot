name: Veytrix Quick AI Coding Proof

on:
  push:
    branches:
      - test/free-ai-quick
    paths:
      - hardcore-ai-test/TRIGGER-*

permissions:
  contents: read

jobs:
  quick-ai-proof:
    name: Real AI quick coding solve + test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run unmodified quick benchmark first
        working-directory: hardcore-ai-test
        run: node test/spec.mjs || true

      - name: Run real AI quick coding benchmark
        working-directory: hardcore-ai-test
        env:
          QUICK_MAX_MODELS: 4
          QUICK_MODEL_TIMEOUT_MS: 45000
        run: node run-agent.mjs

      - name: Print machine-verifiable result
        working-directory: hardcore-ai-test
        if: always()
        run: |
          test -f report.json && cat report.json || echo '{"report":"missing"}'

      - name: Upload quick benchmark proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veytrix-quick-ai-proof
          path: hardcore-ai-test/report.json
          if-no-files-found: error
