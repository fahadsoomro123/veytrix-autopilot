name: Veytrix Free AI Mesh Canary

on:
  push:
    branches:
      - 'test/free-ai-mesh-canary'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  free-ai-mesh-failover:
    name: 3m-lane hardcore failure and failover test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout canary revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Run 3m-lane hardcore provider-failure canary
        shell: bash
        run: |
          set -euo pipefail
          node free-ai-mesh/free_ai_mesh_canary.mjs

      - name: Assert 3m hardcore canary proof markers
        shell: bash
        run: |
          set -euo pipefail
          node free-ai-mesh/free_ai_mesh_canary.mjs | tee /tmp/free-ai-mesh-canary.log
          grep -Fxq 'FREE_AI_MESH_3M_HARDCORE_CANARY=PASS' /tmp/free-ai-mesh-canary.log
          grep -Fxq 'discovered_lanes=3000000' /tmp/free-ai-mesh-canary.log
          grep -Fxq 'consecutive_failures=100000' /tmp/free-ai-mesh-canary.log
          grep -Fxq 'successful_fallback=free-lane-100001' /tmp/free-ai-mesh-canary.log
          grep -Fxq 'second_request_preferred=free-lane-100001' /tmp/free-ai-mesh-canary.log
