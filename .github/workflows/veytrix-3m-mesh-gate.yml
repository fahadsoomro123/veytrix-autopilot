name: VEYTRIX 3M Free AI Mesh Gate

on:
  push:
    branches:
      - implementation/phase4-github-resilience
    paths:
      - 'free-ai-mesh/**'
      - 'scripts/verify_veytrix_mesh_contract.sh'
      - '.github/workflows/veytrix-3m-mesh-gate.yml'
  pull_request:
    paths:
      - 'free-ai-mesh/**'
      - 'scripts/verify_veytrix_mesh_contract.sh'
      - '.github/workflows/veytrix-3m-mesh-gate.yml'
  workflow_dispatch:
    inputs:
      full_3m:
        description: 'Run the 3,000,000-lane synthetic hardcore canary'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  smoke:
    name: Mesh contract and integration smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify protected mesh contract
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify_veytrix_mesh_contract.sh .

      - name: Run integration failover canary
        shell: bash
        run: |
          set -euo pipefail
          node free-ai-mesh/veytrix_ai_router_canary.mjs

      - name: Verify engine routing self-test
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/test_decide_engine.sh

  hardcore:
    name: 3M-lane synthetic resilience canary
    if: github.event_name == 'workflow_dispatch' && inputs.full_3m == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify protected mesh contract
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify_veytrix_mesh_contract.sh .

      - name: Run 3M-lane hardcore canary
        shell: bash
        run: |
          set -euo pipefail
          node --max-old-space-size=4096 free-ai-mesh/free_ai_mesh_canary.mjs
