name: Veytrix Smart Autopilot

on:
  workflow_dispatch:
    inputs:
      mission:
        description: 'Autonomous engineering mission'
        required: true
        type: string
      target_repository:
        description: 'Target repository owner/name'
        required: true
        default: 'owner/repository'
        type: string
      branch:
        description: 'Target branch'
        required: true
        default: 'main'
        type: string
      engine:
        description: 'Execution engine'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - github-free
          - ai
      verification_depth:
        description: 'Maximum bounded verification handoffs'
        required: true
        default: '2'
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: veytrix-smart-autopilot-${{ github.run_id }}
  cancel-in-progress: false

env:
  MAX_FREE_RERUNS: '2'
  MAX_VERIFICATION_HANDOFFS: '2'

jobs:
  manual-mission:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AUTOPILOT_MISSION: ${{ inputs.mission }}
    steps:
      - name: Capture mission start boundary
        shell: bash
        run: echo "MISSION_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout Veytrix core
        uses: actions/checkout@v4
        with:
          ref: main
          path: .veytrix-core
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.branch }}
          token: ${{ secrets.VEYTRIX_GITHUB_TOKEN }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Validate mission controls
        shell: bash
        run: |
          set -euo pipefail
          test -n '${{ inputs.mission }}'
          test -n '${{ inputs.target_repository }}'
          test -n '${{ inputs.branch }}'
          depth='${{ inputs.verification_depth }}'
          [[ "$depth" =~ ^[0-9]+$ ]] || { echo 'Invalid verification_depth'; exit 1; }
          [ "$depth" -le "$MAX_VERIFICATION_HANDOFFS" ] || { echo 'verification_depth exceeds safety ceiling'; exit 1; }

      - name: Repository preflight
        env:
          AUTOPILOT_TARGET_REPOSITORY: ${{ inputs.target_repository }}
        shell: bash
        run: |
          set -euo pipefail
          bash .veytrix-core/scripts/deterministic_inspect.sh target

      - name: Deterministic verification attempt
        id: deterministic
        working-directory: target
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          bash ../.veytrix-core/scripts/deterministic_verify.sh . > /tmp/veytrix-deterministic-verification.log 2>&1
          cat /tmp/veytrix-deterministic-verification.log

      - name: Engine decision self-test
        shell: bash
        run: |
          set -euo pipefail
          bash .veytrix-core/scripts/test_decide_engine.sh

      - name: Determine engine
        id: engine
        env:
          REQUESTED_ENGINE: ${{ inputs.engine }}
          DETERMINISTIC_OUTCOME: ${{ steps.deterministic.outcome }}
          MISSION: ${{ inputs.mission }}
        shell: bash
        run: |
          set -euo pipefail
          ai_available=false
          if [[ -n "${OPENAI_API_KEY:-}" ]]; then ai_available=true; fi
          decision="$(bash .veytrix-core/scripts/decide_engine.sh "$REQUESTED_ENGINE" "$DETERMINISTIC_OUTCOME" "$MISSION" "$ai_available")"
          while IFS='=' read -r key value; do
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_OUTPUT"
          done <<< "$decision"
          selected="$(awk -F= '$1=="selected" {print $2}' <<< "$decision")"
          reason="$(awk -F= '$1=="reason" {print $2}' <<< "$decision")"
          echo "Selected engine: $selected"
          echo "Decision reason: $reason"
          {
            echo '### Veytrix engine decision'
            echo "- Requested engine: $REQUESTED_ENGINE"
            echo "- Deterministic verification outcome: $DETERMINISTIC_OUTCOME"
            echo "- Selected engine: $selected"
            echo "- Decision reason: $reason"
            if [[ "$selected" == 'ai' ]]; then
              echo '- AI escalation: required by decision boundary; API-key presence alone was not sufficient.'
            else
              echo '- AI escalation: not invoked by this decision.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: AI mission execution
        if: steps.engine.outputs.selected == 'ai'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          working-directory: target
          output-file: /tmp/veytrix-codex-result.txt
          prompt: |
            You are Veytrix Smart Autopilot operating on target repository ${{ inputs.target_repository }} branch ${{ inputs.branch }}.

            Mission:
            ${{ inputs.mission }}

            Deterministic-first contract:
            1. Inspect architecture and current state before editing.
            2. Deterministic inspection/verification has already run. Review /tmp/veytrix-deterministic-verification.log when present.
            3. AI was selected only because the decision engine determined that deterministic verification was insufficient or the mission requires source-level reasoning.
            4. Make the smallest robust production-quality changes.
            5. Run narrow tests/build checks first, then final verification.
            6. Never expose or modify secrets, tokens, signing keys, keystores, credentials, or security controls.
            7. Never disable tests or hide failures.
            8. Do not commit or push; the outer workflow handles that.
            9. Stop only when the mission is genuinely verified or a concrete blocker is proven.
            10. Report files changed, root causes, commands run, verification results, artifacts, and blockers.

      - name: Deterministic-only result
        if: steps.engine.outputs.selected == 'github-free'
        shell: bash
        run: |
          set -euo pipefail
          reason='${{ steps.engine.outputs.reason }}'
          if [ '${{ steps.deterministic.outcome }}' = 'success' ] && [[ "$reason" == deterministic-capability-sufficient* ]]; then
            echo 'Deterministic capability was sufficient for this verification-only mission.'
            echo 'AI was not invoked.'
            exit 0
          fi
          echo 'GitHub-free mode cannot claim completion of an arbitrary implementation mission.'
          echo "Decision reason: $reason"
          if [ '${{ steps.deterministic.outcome }}' = 'success' ]; then
            echo 'Deterministic verification passed, but that does not prove the requested implementation mission complete.'
          else
            echo 'Deterministic verification did not prove the requested mission complete.'
          fi
          exit 20

      - name: Verify target repository after AI
        if: steps.engine.outputs.selected == 'ai'
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          bash ../.veytrix-core/scripts/deterministic_verify.sh .

      - name: Push AI mission result
        if: steps.engine.outputs.selected == 'ai'
        id: push
        env:
          GH_TOKEN: ${{ secrets.VEYTRIX_GITHUB_TOKEN }}
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No source changes produced by AI; refusing to claim a repair.'
            exit 0
          fi
          git config user.name 'Veytrix Smart Autopilot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ inputs.target_repository }}.git"
          git add -A
          git diff --cached --quiet || git commit -m 'veytrix: complete requested mission'
          git push origin "HEAD:${{ inputs.branch }}"

      - name: Observe target CI and perform deterministic recovery
        if: steps.engine.outputs.selected == 'ai' && steps.push.outcome == 'success'
        id: target_recovery
        env:
          GH_TOKEN: ${{ secrets.VEYTRIX_GITHUB_TOKEN }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          TARGET_BRANCH: ${{ inputs.branch }}
          STARTED_EPOCH: ${{ env.MISSION_STARTED_EPOCH }}
          MAX_FREE_RERUNS: ${{ env.MAX_FREE_RERUNS }}
          AUTOPILOT_TARGET_TIMEOUT_MINUTES: '20'
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          bash .veytrix-core/scripts/target_ci_recovery.sh

      - name: AI target-CI repair escalation
        if: steps.engine.outputs.selected == 'ai' && steps.push.outcome == 'success' && steps.target_recovery.outcome == 'failure' && env.OPENAI_API_KEY != ''
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          working-directory: target
          output-file: /tmp/veytrix-target-repair.txt
          prompt: |
            The target repository CI did not pass after the first mission repair and deterministic recovery was insufficient.

            Review:
            - /tmp/veytrix-target-run.json
            - /tmp/veytrix-target-failure.log
            - /tmp/veytrix-target-classification.txt

            Diagnose the actual source/build/test issue and make the smallest correct repair.
            Never expose secrets, signing keys, credentials or tokens. Never disable tests or verification. Do not commit or push; the outer workflow will do that. Verify the repair before stopping.

      - name: Push bounded target-CI repair
        if: steps.engine.outputs.selected == 'ai' && steps.push.outcome == 'success' && steps.target_recovery.outcome == 'failure' && env.OPENAI_API_KEY != ''
        env:
          GH_TOKEN: ${{ secrets.VEYTRIX_GITHUB_TOKEN }}
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No second-round target repair produced; concrete blocker remains.'
            exit 0
          fi
          git config user.name 'Veytrix Smart Autopilot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ inputs.target_repository }}.git"
          git add -A
          git diff --cached --quiet || git commit -m 'veytrix: repair target CI after mission'
          git push origin "HEAD:${{ inputs.branch }}"
