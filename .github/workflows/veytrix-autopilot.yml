name: Veytrix Smart Autopilot

on:
  workflow_dispatch:
    inputs:
      mission:
        description: 'Autonomous engineering mission'
        required: true
        type: string
      target_repository:
        description: 'Target repository owner/name'
        required: true
        type: string
      branch:
        description: 'Target branch'
        required: true
        default: 'main'
        type: string
      engine:
        description: 'Execution engine'
        required: true
        default: 'auto'
        type: choice
        options: [auto, github-free, ai, mesh]
      verification_depth:
        description: 'Maximum bounded verification handoffs'
        required: true
        default: '2'
        type: string

permissions:
  contents: read

concurrency:
  group: veytrix-autopilot-${{ inputs.target_repository }}-${{ inputs.branch }}
  cancel-in-progress: false

env:
  MAX_VERIFICATION_HANDOFFS: '2'

jobs:
  mission:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      AUTOPILOT_MISSION: ${{ inputs.mission }}
      AUTOPILOT_TARGET_REPOSITORY: ${{ inputs.target_repository }}
      AUTOPILOT_TARGET_BRANCH: ${{ inputs.branch }}
      AUTOPILOT_ENGINE: ${{ inputs.engine }}
      AUTOPILOT_VERIFICATION_DEPTH: ${{ inputs.verification_depth }}

    steps:
      - name: Checkout Veytrix core
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .veytrix-core
          fetch-depth: 1
          persist-credentials: false

      - name: Validate mission controls
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AUTOPILOT_MISSION}"
          test "${#AUTOPILOT_MISSION}" -le 4000

          if [[ ! "${AUTOPILOT_TARGET_REPOSITORY}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo 'Target repository must match the safe owner/repository form.'
            exit 1
          fi

          if [[ "${AUTOPILOT_TARGET_REPOSITORY}" == *..* ]]; then
            echo 'Target repository contains an invalid path sequence.'
            exit 1
          fi

          if [[ ! "${AUTOPILOT_TARGET_BRANCH}" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo 'Target branch contains unsupported characters.'
            exit 1
          fi

          git check-ref-format --branch "${AUTOPILOT_TARGET_BRANCH}"

          case "${AUTOPILOT_ENGINE}" in
            auto|github-free|ai|mesh) ;;
            *) echo 'Invalid execution engine.'; exit 1 ;;
          esac

          [[ "${AUTOPILOT_VERIFICATION_DEPTH}" =~ ^[0-9]+$ ]] || exit 1
          [ "${AUTOPILOT_VERIFICATION_DEPTH}" -le "${MAX_VERIFICATION_HANDOFFS}" ] || exit 1

      - name: Checkout target repository
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.branch }}
          token: ${{ secrets.VEYTRIX_GITHUB_TOKEN }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Repository preflight
        working-directory: target
        env:
          AUTOPILOT_TARGET_REPOSITORY: ${{ inputs.target_repository }}
        run: bash ../.veytrix-core/scripts/deterministic_inspect.sh .

      - name: Deterministic verification attempt
        id: deterministic
        working-directory: target
        continue-on-error: true
        run: |
          set -euo pipefail
          bash ../.veytrix-core/scripts/deterministic_verify.sh . \
            > /tmp/veytrix-deterministic-verification.log 2>&1
          cat /tmp/veytrix-deterministic-verification.log

      - name: Engine decision self-test
        run: bash .veytrix-core/scripts/test_decide_engine.sh

      - name: Detect primary AI availability
        id: ai
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -n "${OPENAI_API_KEY:-}" ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Detect Free AI Mesh availability
        id: mesh
        env:
          PUTER_AUTH_TOKEN: ${{ secrets.PUTER_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "${PUTER_AUTH_TOKEN:-}" ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Determine engine
        id: engine
        env:
          REQUESTED_ENGINE: ${{ inputs.engine }}
          DETERMINISTIC_OUTCOME: ${{ steps.deterministic.outcome }}
          MISSION: ${{ inputs.mission }}
          AI_AVAILABLE: ${{ steps.ai.outputs.available }}
          MESH_AVAILABLE: ${{ steps.mesh.outputs.available }}
        run: |
          set -euo pipefail
          decision="$(bash .veytrix-core/scripts/decide_engine.sh \
            "${REQUESTED_ENGINE}" "${DETERMINISTIC_OUTCOME}" \
            "${MISSION}" "${AI_AVAILABLE}" "${MESH_AVAILABLE}")"
          while IFS='=' read -r key value; do
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_OUTPUT"
          done <<< "$decision"
          printf '%s\n' "$decision"

      - name: AI mission execution
        id: codex
        continue-on-error: true
        if: ${{ steps.engine.outputs.selected == 'ai' }}
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          working-directory: target
          output-file: /tmp/veytrix-codex-result.txt
          prompt: |
            You are Veytrix Smart Autopilot operating on target repository
            ${{ inputs.target_repository }} branch ${{ inputs.branch }}.

            Mission:
            ${{ inputs.mission }}

            Contract:
            - Inspect before editing.
            - Make the smallest robust production-quality change.
            - Never read, print, modify, or exfiltrate secrets, tokens,
              credentials, signing keys, keystores, or environment secrets.
            - Never disable tests, security controls, or verification.
            - Do not commit or push; the outer workflow owns publication.
            - Stop only when genuinely verified or a concrete blocker is proven.

      - name: Prepare Free AI Mesh verification toolchain
        if: >-
          (steps.engine.outputs.selected == 'mesh' ||
           (steps.engine.outputs.selected == 'ai' &&
            steps.codex.outcome != 'success' &&
            steps.mesh.outputs.available == 'true')) &&
          hashFiles('target/android/settings.gradle.kts') != ''
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Free AI Mesh Gradle toolchain
        if: >-
          (steps.engine.outputs.selected == 'mesh' ||
           (steps.engine.outputs.selected == 'ai' &&
            steps.codex.outcome != 'success' &&
            steps.mesh.outputs.available == 'true')) &&
          hashFiles('target/android/settings.gradle.kts') != ''
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Free AI Mesh fallback executor
        id: mesh_fallback
        continue-on-error: true
        if: >-
          steps.engine.outputs.selected == 'mesh' ||
          (steps.engine.outputs.selected == 'ai' &&
           steps.codex.outcome != 'success' &&
           steps.mesh.outputs.available == 'true')
        env:
          AUTOPILOT_MISSION: ${{ inputs.mission }}
          PUTER_AUTH_TOKEN: ${{ secrets.PUTER_AUTH_TOKEN }}
          VEYTRIX_CORE_DIR: ${{ github.workspace }}/.veytrix-core
          VEYTRIX_TARGET_DIR: ${{ github.workspace }}/target
          MESH_MAX_ATTEMPTS: '6'
          MESH_COOLDOWN_MS: '15000'
        run: |
          set -euo pipefail
          node .veytrix-core/free-ai-mesh/mesh_autopilot.mjs
      - name: Deterministic-only result
        if: ${{ steps.engine.outputs.selected == 'github-free' }}
        run: |
          set -euo pipefail
          reason='${{ steps.engine.outputs.reason }}'
          if [[ "${{ steps.deterministic.outcome }}" == 'success' ]] &&
             [[ "$reason" == deterministic-capability-sufficient* ]]; then
            echo 'Deterministic capability was sufficient for this verification-only mission.'
            exit 0
          fi
          echo 'GitHub-free mode cannot claim completion of an arbitrary implementation mission.'
          exit 20

      - name: Verify target repository after execution
        if: >-
          steps.codex.outcome == 'success' ||
          steps.mesh_fallback.outcome == 'success'
        working-directory: target
        run: |
          set -euo pipefail
          bash ../.veytrix-core/scripts/deterministic_verify.sh . || {
            rc=$?
            if [[ $rc -ne 20 ]]; then exit $rc; fi
            echo 'No generic deterministic verifier matched this target; continuing.'
          }

      - name: Verify Free AI Mesh patch policy
        if: steps.mesh_fallback.outcome == 'success'
        working-directory: target
        run: bash ../.veytrix-core/scripts/verify_veytrix_mesh_patch_policy.sh .

      - name: Execution result gate
        if: always()
        run: |
          set -euo pipefail
          if [[ '${{ steps.codex.outcome }}' == 'success' ||
                '${{ steps.mesh_fallback.outcome }}' == 'success' ]]; then
            exit 0
          fi
          echo 'Neither primary AI nor Free AI Mesh produced a verified execution.' >&2
          exit 1

      - name: Publish verified mission
        if: >-
          (steps.codex.outcome == 'success' ||
           steps.mesh_fallback.outcome == 'success')
        working-directory: target
        env:
          GH_TOKEN: ${{ secrets.VEYTRIX_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No source changes produced by AI; refusing to claim a repair.'
            exit 0
          fi
          git config user.name 'Veytrix Smart Autopilot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'veytrix: complete requested mission'
          git -c "http.extraheader=AUTHORIZATION: bearer ${GH_TOKEN}" \
            push origin "HEAD:${AUTOPILOT_TARGET_BRANCH}"
